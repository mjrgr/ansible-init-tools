# Global mise config. `mise run dotfiles:mise` links ~/.config/mise to this
# directory, so every tool below is on PATH in every shell, and mise.lock
# (versions, URLs, sha256 per platform) sits next to it under git.
#
# Pins are concrete on purpose: two machines provisioned months apart get the
# same binaries. Bump with `make bump`, audit with `make drift`.

[settings]
lockfile = true
# Linux only: the matching_regex entries below name no macOS/Windows asset.
lockfile_platforms = ["linux-x64", "linux-arm64"]

[env]
K9S_FEATURE_GATE_NODE_SHELL = "true"
# base16 renders through the terminal's own palette, like BAT_THEME in the old .zshrc.
BAT_THEME = "base16"
# There is no Docker Engine here (see README, "Containers: podman, not docker").
KIND_EXPERIMENTAL_PROVIDER = "podman"
# mise owns the Claude Code version; its self-updater would fight the pin.
DISABLE_AUTOUPDATER = "1"

# Registry overrides and names for tools the registry lacks or routes elsewhere
# (helmfile -> packslip, neovim -> vfox). aqua is preferred: it downloads from
# the release URL, never from api.github.com, and carries upstream checksums.
[tool_alias]
argo9s = "github:vvrnv/argo9s"
certigo = "github:square/certigo"
cilium = "aqua:cilium/cilium-cli"
clauth = "cargo:clauth"
cloud-provider-kind = "aqua:kubernetes-sigs/cloud-provider-kind"
codex = "github:openai/codex"
codex-code-mode-host = "github:openai/codex"
gitlogue = "github:unhappychoice/gitlogue"
helm-schema = "aqua:dadav/helm-schema"
helmfile = "aqua:helmfile/helmfile"
hubble = "aqua:cilium/hubble"
krew = "github:kubernetes-sigs/krew"
kwok = "github:kubernetes-sigs/kwok"
neovim = "aqua:neovim/neovim"

[tools]
# ── Kubernetes ──────────────────────────────────────────────────────────────
kubectl = "1.37.2"
helm = "4.3.2"
kind = "0.33.0"
# One release, two binaries; kwokctl has its own registry entry.
kwok = { version = "0.8.0", matching_regex = '^kwok-linux-(amd64|arm64)$', bin = "kwok" }
kwokctl = "0.8.0"
k9s = "0.51.0"
popeye = "0.22.1"
sofka = "0.36.0"
argo9s = "0.1.0"
# Installed as kubectl-krew so `kubectl krew` resolves; plugins come from `mise run krew-plugins`.
krew = { version = "0.5.0", matching_regex = '^krew-linux_(amd64|arm64)\.tar\.gz$', rename_exe = "kubectl-krew" }
helmfile = "1.8.4"
nerdctl = "2.4.2"
crictl = "1.37.0"
argocd = "3.6.1"
kubectx = "0.11.0"
kubens = "0.11.0"
kubie = "0.28.0"
cilium = "0.20.3"
hubble = "1.20.4"
kyverno = "1.20.0"
vcluster = "0.37.6"
cmctl = "2.6.2"
k0sctl = "0.33.1"
telepresence = "2.33.0"
cloud-provider-kind = "0.12.0"
helm-schema = "0.24.0"

# ── IaC / supply chain ──────────────────────────────────────────────────────
opentofu = "1.13.9"
trivy = "0.76.2"
cosign = "3.1.4"
oras = "1.3.6"
dive = "0.13.1"
ko = "0.19.1"

# ── Data / secrets ──────────────────────────────────────────────────────────
yq = "4.54.3"
jq = "1.8.2"
gh = "2.104.0"
sops = "3.13.3"
age = "1.3.2"
# github, not aqua: the aqua package carries no linux-arm64 build, upstream does.
certigo = { version = "1.18.2", matching_regex = '^certigo-linux-(amd64|arm64)$', bin = "certigo" }

# ── Shell / terminal ────────────────────────────────────────────────────────
starship = "1.27.0"
fzf = "0.75.0"
btop = "1.4.8"
eza = "0.23.5"
ripgrep = "15.2.0"
fd = "10.5.2"
bat = "0.26.1"
zoxide = "0.10.0"
delta = "0.20.1"
lazygit = "0.66.3"
glow = "3.0.0"
gum = "2.0.2"
vhs = "0.12.1"
gitlogue = "0.12.2"
neovim = "0.12.6"

# ── Coding agents ───────────────────────────────────────────────────────────
# Static musl build from the GitHub release, tagged rust-v<x.y.z>. Two tools
# from one release: code_mode_host ships enabled and fails without its helper.
codex = { version = "0.169.0", version_prefix = "rust-v", matching_regex = '^codex-(x86_64|aarch64)-unknown-linux-musl\.tar\.gz$', rename_exe = "codex" }
codex-code-mode-host = { version = "0.169.0", version_prefix = "rust-v", matching_regex = '^codex-code-mode-host-(x86_64|aarch64)-unknown-linux-musl\.tar\.gz$', rename_exe = "codex-code-mode-host" }
# "latest" at lock time: mise.lock pins it, `mise upgrade claude` moves it.
claude = "latest"
herdr = "0.9.5"
# Built from crates.io: upstream publishes no linux-arm64 asset.
clauth = "0.18.2"
# Toolchain for the herdr plugins that ship as source; clauth needs edition2024 (>= 1.85).
rust = "1.100.0"

# ── Tasks ───────────────────────────────────────────────────────────────────
# File tasks live in mise/tasks/ (bootstrap, one script per dotfiles group);
# these only compose them. `mise tasks` lists everything with its description.
#
# First run on a fresh box is `make setup`, not `mise run setup`: mise run
# installs the missing tools before any task, and rust needs the bootstrap's
# toolchain to be there first.

[tasks.setup]
description = "Bootstrap (sudo), every tool, every dotfiles group (= make setup, for a box already bootstrapped once)"
run = ["mise run bootstrap", "mise run install", "mise run dotfiles"]

[tasks.upgrade]
description = "Owned system packages to their latest (sudo), then every pin to upstream's latest (= make upgrade)"
run = ["mise run bootstrap -- --upgrade", "mise upgrade --bump"]

[tasks.install]
description = "Install every pinned tool, then the krew plugins (= make install)"
run = ["mise install", "mise run krew-plugins"]

[tasks.dotfiles]
description = "Deploy every dotfiles group (= make dotfiles)"
depends = [
  "dotfiles:mise", "dotfiles:zsh", "dotfiles:starship", "dotfiles:tmux", "dotfiles:git",
  "dotfiles:wezterm", "dotfiles:herdr", "dotfiles:fonts", "dotfiles:btop", "dotfiles:nvim",
]
run = """
echo "Dotfiles linked from $(dirname "$(readlink -f ~/.config/mise)")/dotfiles"
echo "Backups of replaced files: ~/.dotfiles-backup"
echo "Still to fill in: ~/.zshenv.local (secrets), ~/.gitconfig.local (identity)"
echo "Rollback: mise run rollback"
"""
