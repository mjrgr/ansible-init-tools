# Global mise config. `mise run dotfiles:mise` links ~/.config/mise to this
# directory, so every tool below is on PATH in every shell, and mise.lock
# (versions, URLs, sha256 per platform) sits next to it under git.
#
# Pins are concrete on purpose: two machines provisioned months apart get the
# same binaries. Bump with `make bump`, audit with `make drift`.

[settings]
lockfile = true
# Linux only: the matching_regex entries below name no macOS/Windows asset.
lockfile_platforms = ["linux-x64", "linux-arm64"]

[env]
K9S_FEATURE_GATE_NODE_SHELL = "true"
# base16 renders through the terminal's own palette, like BAT_THEME in the old .zshrc.
BAT_THEME = "base16"
# There is no Docker Engine here (see README, "Containers: podman, not docker").
KIND_EXPERIMENTAL_PROVIDER = "podman"
# mise owns the Claude Code version; its self-updater would fight the pin.
DISABLE_AUTOUPDATER = "1"
GOPATH = "{{env.HOME}}/go"
# These land ahead of the tool dirs, so ~/.cargo/bin (rustup proxies) stays out: .zshenv sources ~/.cargo/env.
_.path = ["{{env.HOME}}/bin", "{{env.HOME}}/.local/bin", "{{env.HOME}}/go/bin"]

# Registry overrides and names for tools the registry lacks or routes elsewhere
# (helmfile -> packslip, neovim -> vfox). aqua is preferred: it downloads from
# the release URL, never from api.github.com, and carries upstream checksums.
[tool_alias]
argo9s = "github:vvrnv/argo9s"
certigo = "github:square/certigo"
cilium = "aqua:cilium/cilium-cli"
clauth = "cargo:clauth"
cloud-provider-kind = "aqua:kubernetes-sigs/cloud-provider-kind"
codex = "aqua:openai/codex"
gitlogue = "github:unhappychoice/gitlogue"
# pypi: a uv lock (hashes of every wheel) sits in locks/, keyed by mise.lock.
openstackclient = "pypi:python-openstackclient"
# npm: same scheme, an "aube" lock (integrity of every package) in locks/.
ccstatusline = "npm:ccstatusline"
cloudcli = "npm:@cloudcli-ai/cloudcli"
task-master-ai = "npm:task-master-ai"
open-meteo-mcp-server = "npm:open-meteo-mcp-server"
helm-schema = "aqua:dadav/helm-schema"
helmfile = "aqua:helmfile/helmfile"
hubble = "aqua:cilium/hubble"
krelay = "github:knight42/krelay"
kubectl-cnpg = "github:cloudnative-pg/cloudnative-pg"
kubectl-whoami = "aqua:rajatjindal/kubectl-whoami"
kwok = "github:kubernetes-sigs/kwok"
neovim = "aqua:neovim/neovim"

[tools]
# ── Kubernetes ──────────────────────────────────────────────────────────────
kubectl = "1.37.2"
helm = "4.3.2"
kind = "0.33.0"
# One release, two binaries; kwokctl has its own registry entry.
kwok = { version = "0.8.0", matching_regex = '^kwok-linux-(amd64|arm64)$', bin = "kwok" }
kwokctl = "0.8.0"
k9s = "0.51.0"
popeye = "0.22.1"
sofka = "0.37.0"
argo9s = "0.1.0"
# kubectl plugins, formerly krew: `kubectl <name>` finds kubectl-<name> on PATH (stern runs on its own).
stern = "1.35.0"
kubectl-whoami = "0.0.48"
kubectl-cnpg = { version = "1.30.2", matching_regex = '^kubectl-cnpg_.*_linux_(x86_64|arm64)\.tar\.gz$' }
krelay = { version = "0.2.0", matching_regex = '^kubectl-relay_v.*_linux-(amd64|arm64)\.tar\.gz$' }
helmfile = "1.8.5"
nerdctl = "2.4.2"
crictl = "1.37.0"
argocd = "3.6.2"
kubectx = "0.11.0"
kubens = "0.11.0"
kubie = "0.28.0"
cilium = "0.20.3"
hubble = "1.20.4"
kyverno = "1.20.0"
vcluster = "0.38.0"
cmctl = "2.6.2"
k0sctl = "0.33.1"
telepresence = "2.33.4"
cloud-provider-kind = "0.12.0"
helm-schema = "0.24.0"

# ── IaC / supply chain ──────────────────────────────────────────────────────
opentofu = "1.13.9"
trivy = "0.76.2"
# Also what the pre-commit hook runs (same version as the image `make scan` pins).
gitleaks = "8.30.1"
cosign = "3.1.4"
oras = "1.4.0"
dive = "0.13.1"
ko = "0.19.1"

# ── Data / secrets ──────────────────────────────────────────────────────────
yq = "4.54.3"
jq = "1.8.2"
gh = "2.105.0"
glab = "1.131.0"
sops = "3.13.3"
age = "1.3.2"
# github, not aqua: the aqua package carries no linux-arm64 build, upstream does.
certigo = { version = "1.18.2", matching_regex = '^certigo-linux-(amd64|arm64)$', bin = "certigo" }

# ── Shell / terminal ────────────────────────────────────────────────────────
starship = "1.27.0"
fzf = "0.75.0"
btop = "1.4.8"
eza = "0.23.5"
ripgrep = "16.0.0"
fd = "10.5.2"
bat = "0.26.1"
zoxide = "0.10.0"
delta = "0.22.0"
lazygit = "0.66.3"
glow = "3.0.0"
gum = "2.0.2"
vhs = "0.12.1"
gitlogue = "0.12.2"
neovim = "0.12.6"

# ── Runtimes / cloud ────────────────────────────────────────────────────────
# python also locks the pypi: dependency graph (uv needs an interpreter to resolve it).
python = "3.14.10"
uv = "0.13.9"
node = "24.22.3"
bun = "1.4.5"
openstackclient = { version = "10.5.0", with = ["python-octaviaclient"] }

# ── Coding agents ───────────────────────────────────────────────────────────
# One package: codex, codex-code-mode-host (code_mode_host ships enabled, fails without it), codex-exec-server.
codex = "0.171.0"
# "latest" at lock time: mise.lock pins it, `mise upgrade claude` moves it.
claude = "latest"
herdr = "0.9.5"
# Built from crates.io: upstream publishes no linux-arm64 asset.
clauth = "0.18.2"
# Toolchain for the herdr plugins that ship as source; clauth needs edition2024 (>= 1.85).
rust = "1.100.0"
# Formerly `npm i -g` under nvm: the Claude Code status line, the browser MCP (cloudcli), task-master, open-meteo MCP.
ccstatusline = "2.2.27"
cloudcli = "1.37.5"
task-master-ai = "0.43.1"
open-meteo-mcp-server = "2.5.2"

# ── Machine setup: `mise bootstrap` (see CLAUDE.md) ─
# ── System packages (mise skips the manager the host does not have) ─────────
[bootstrap.packages]
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:wget" = "latest"
"apt:gnupg" = "latest"
"apt:unzip" = "latest"
"apt:zsh" = "latest"
"apt:fontconfig" = "latest"
"apt:ca-certificates" = "latest"
"apt:python3" = "latest"
"apt:build-essential" = "latest"
"apt:pkg-config" = "latest"
"apt:libssl-dev" = "latest"
"apt:podman" = "latest"
"apt:podman-docker" = "latest"
"apt:wezterm" = "latest"
"apt:code" = "latest"
"dnf:git" = "latest"
"dnf:curl" = "latest"
# Real package names, not provides: `wget` and `util-linux-user` would be reinstalled every run.
"dnf:wget2-wget" = "latest"
"dnf:gnupg2" = "latest"
"dnf:unzip" = "latest"
"dnf:zsh" = "latest"
"dnf:fontconfig" = "latest"
"dnf:ca-certificates" = "latest"
"dnf:python3" = "latest"
"dnf:make" = "latest"
"dnf:gcc" = "latest"
"dnf:gcc-c++" = "latest"
"dnf:pkgconf-pkg-config" = "latest"
"dnf:openssl-devel" = "latest"
"dnf:util-linux" = "latest"
"dnf:podman" = "latest"
"dnf:podman-docker" = "latest"
"dnf:wezterm" = "latest"
"dnf:code" = "latest"

[bootstrap.apt.sources.wezterm]
uris = "https://apt.fury.io/wez/"
suites = "*"
components = "*"
key = "https://apt.fury.io/wez/gpg.key"
fingerprint = "0CA603116C960BAFB2BF310BD7BA31CF90C4B319"

[bootstrap.apt.sources.vscode]
uris = "https://packages.microsoft.com/repos/code"
suites = "stable"
components = "main"
key = "https://packages.microsoft.com/keys/microsoft.asc"
fingerprint = "BC528686B50D79E339D3721CEB3E94ADBE1229CF"

[bootstrap.dnf.repos]
wezterm = { copr = "wezfurlong/wezterm-nightly" }

# Ubuntu ships no search registry: `docker run mcp/grafana` fails on short names.
[bootstrap.files."/etc/containers/registries.conf.d/10-unqualified-search.conf"]
content = """
unqualified-search-registries = ["docker.io"]
"""

# Silences the podman-docker shim's "Emulate Docker CLI using podman" banner.
[bootstrap.files."/etc/containers/nodocker"]
content = ""

# Per package manager, so not managed files: apt needs the debconf answer (the code
# postinst adds its own copy of the repo), dnf needs the vscode repo (not a COPR).
[bootstrap.hooks.pre-packages]
description = "vscode: debconf opt-out (apt) or the repo file (dnf)"
run = '''
if command -v debconf-set-selections >/dev/null; then
  echo 'code code/add-microsoft-repo boolean false' | sudo debconf-set-selections
fi
if command -v dnf >/dev/null && [ ! -f /etc/yum.repos.d/vscode.repo ]; then
  printf '%s\n' '[code]' 'name=Visual Studio Code' 'baseurl=https://packages.microsoft.com/yumrepos/vscode' \
    'enabled=1' 'gpgcheck=1' 'gpgkey=https://packages.microsoft.com/keys/microsoft.asc' | sudo tee /etc/yum.repos.d/vscode.repo >/dev/null
fi
'''

# ── oh-my-zsh and its plugins: clones, not the curl|sh installer ─────────────
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh", depth = 1 }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions", depth = 1 }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting", depth = 1 }
"~/.oh-my-zsh/custom/plugins/zsh-history-substring-search" = { url = "https://github.com/zsh-users/zsh-history-substring-search", depth = 1 }
"~/.oh-my-zsh/custom/plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab", depth = 1 }

# ── Dotfiles: symlinks into the clone (sources are relative to this file) ────
[dotfiles]
"~/.config/mise" = { source = ".", mode = "symlink" }
"~/.zshrc" = { source = "../dotfiles/zsh/.zshrc", mode = "symlink" }
"~/.zshenv" = { source = "../dotfiles/zsh/.zshenv", mode = "symlink" }
"~/.config/zsh/wezterm.zsh" = { source = "../dotfiles/zsh/config/wezterm.zsh", mode = "symlink" }
"~/.kube/k8s-clusters.sh" = { source = "../dotfiles/kube/k8s-clusters.sh", mode = "symlink" }
"~/.config/krelay/patch-hardened.json" = { source = "../dotfiles/kube/krelay-patch-hardened.json", mode = "symlink" }
"~/.gitconfig" = { source = "../dotfiles/git/.gitconfig", mode = "symlink" }
"~/.tmux.conf" = { source = "../dotfiles/tmux/.tmux.conf", mode = "symlink" }
"~/.config/starship.toml" = { source = "../dotfiles/starship/starship.toml", mode = "symlink" }
"~/.config/nvim" = { source = "../dotfiles/nvim", mode = "symlink" }
"~/.config/btop/btop.conf" = { source = "../dotfiles/btop/btop.conf", mode = "symlink" }
"~/.config/wezterm/wezterm.lua" = { source = "../dotfiles/wezterm/wezterm.lua", mode = "symlink" }
"~/.config/wezterm/claude-state-hook.sh" = { source = "../dotfiles/wezterm/claude-state-hook.sh", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "../dotfiles/herdr/config.toml", mode = "symlink" }
"~/.config/herdr/herd-publish.sh" = { source = "../dotfiles/herdr/herd-publish.sh", mode = "symlink" }
"~/.config/herdr/claude-statusline.sh" = { source = "../dotfiles/herdr/claude-statusline.sh", mode = "symlink" }
"~/.config/herdr/quota-status.sh" = { source = "../dotfiles/herdr/quota-status.sh", mode = "symlink" }
"~/.config/systemd/user/herd-publish.service" = { source = "../dotfiles/herdr/herd-publish.service", mode = "symlink" }
"~/.config/herdr-automatic-rename/config.sh" = { source = "../dotfiles/herdr/automatic-rename.sh", mode = "symlink" }

# ── Login shell ───────────────────────────────────────────────────────────────
# mise runs chsh without sudo and it asks for a password; the bootstrap task repeats
# it through sudo where that is passwordless (the bench), so the part is harmless there.
# The path, not the name: passwd holds /bin/zsh on a box chsh'd before, and mise
# would resolve the name to /usr/bin/zsh and chsh again (same binary, merged /usr).
[bootstrap.user]
login_shell = "/bin/zsh"

# ── Tasks ───────────────────────────────────────────────────────────────────
# File tasks live in mise/tasks/ (bootstrap, one script per dotfiles group);
# these only compose them. `mise tasks` lists everything with its description.
#
# First run on a fresh box is `make setup`, not `mise run setup`: mise run
# installs the missing tools before any task, and rust needs the bootstrap's
# toolchain to be there first.

[tasks.setup]
description = "The whole machine: packages, repos, dotfiles, login shell, tools, then the bootstrap task (= make setup)"
run = "mise bootstrap --yes"

[tasks.upgrade]
description = "Owned system packages to their latest (sudo), every pin to upstream's latest, then check (= make upgrade)"
run = ["mise bootstrap packages upgrade --yes", "mise run bump", "mise run check"]

[tasks.bump]
description = "Every pin to upstream's latest, refresh mise.lock, install (= make bump; edits config.toml)"
# A tool the aqua registry baked into the pinned mise cannot verify yet (see CLAUDE.md); empty when none.
env = { BUMP_EXCLUDE = "" }
run = 'set --; for t in $BUMP_EXCLUDE; do set -- "$@" --exclude "$t"; done; exec mise upgrade --bump "$@"'

[tasks.install]
description = "Install every pinned tool from mise.lock (= make install)"
run = "mise install"

[tasks.dotfiles]
description = "Dotfiles symlinks, then what the bootstrap task adds on top of them (= make dotfiles)"
run = ["mise dot apply --yes", "mise run bootstrap"]
