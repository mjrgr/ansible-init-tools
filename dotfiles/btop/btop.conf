#? Config file for btop v. 1.4.7
#
# Placement: ~/.config/btop/btop.conf (symlinked to this file).
#
# Only the keys that differ from the upstream defaults are set here; btop fills
# in the rest at runtime.

#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and "TTY" for builtin themes.
#* Matched by file stem against "../share/btop/themes" relative to the binary —
#* the `btop` role unpacks the shipped themes into /usr/local/share/btop/themes.
color_theme = "tokyo-night"

#* If the theme set background should be shown, set to False if you want terminal background transparency.
#* False on purpose: wezterm.lua sets window_background_opacity < 1, and a
#* theme-painted background would punch an opaque rectangle through it.
theme_background = False

#* Update time in milliseconds, recommended 2000 ms or above for better sample times for graphs.
update_ms = 1500

#* Automatically save current settings to config file on exit.
#* Off, unlike upstream. The target is a symlink into this repo, so leaving it
#* on means btop rewrites the file on every quit — expanding it to ~100 keys,
#* dropping the comments above, and dirtying `git status`. The cost is that
#* settings toggled inside the TUI do not survive; make them here instead, or
#* flip this to True for a session if you want to pick options interactively
#* and keep the result.
save_config_on_exit = False
