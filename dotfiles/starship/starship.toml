# ╔══════════════════════════════════════════════════════════════╗
# ║              starship.toml — DevOps Edition                  ║
# ║   Nerd Font requis : https://www.nerdfonts.com/font-downloads ║
# ║   Palette : Tokyo Night                                       ║
# ╚══════════════════════════════════════════════════════════════╝
# Placement : ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout      = 100   # ms — raise it if the warning persists (default: 30)
command_timeout   = 800   # ms — avoids freezes on slow modules

# ─── FORMAT GLOBAL ───────────────────────────────────────────────────────────
# Line 1: context (os, directory, git, cloud, tools)
# Line 2: prompt character
format = """
[╭─](bold #3b4261)\
$os\
$sudo\
$username\
$hostname\
$localip\
$directory\
$git_branch\
${custom.git_protected}\
$git_state\
$git_status\
$git_metrics\
[─](bold #3b4261)\
$kubernetes\
$helm\
$terraform\
$docker_context\
$python\
$golang\
$rust\
$ansible\
$shlvl\
$jobs\
$cmd_duration\
$line_break\
[╰─](bold #3b4261)$status$character"""

right_format = """$time"""

# ─── OS ──────────────────────────────────────────────────────────────────────
[os]
disabled = false
style = "bold #7aa2f7"

[os.symbols]
Windows = " "
Ubuntu  = " "
Debian  = " "
Alpine  = " "
Arch    = " "
Macos   = " "
Unknown = " "

# ─── SUDO ────────────────────────────────────────────────────────────────────
[sudo]
disabled = false
style    = "bold #565f89"
symbol   = "🔒 "
format   = "[$symbol]($style)"

# ─── USER / HOST ─────────────────────────────────────────────────────────────
[username]
show_always = false          # n'affiche que si root ou SSH
style_user  = "bold #9ece6a"
style_root  = "bold #f7768e"
format      = "[$user]($style)[@](bold #3b4261)"

[hostname]
ssh_only = true
style    = "bold #ff9e64"
format   = "[$hostname]($style) "

[localip]
ssh_only = true
disabled = false
style    = "bold #565f89"
format   = "[($local_ipv4)]($style) "

# ─── RÉPERTOIRE ──────────────────────────────────────────────────────────────
[directory]
style              = "bold #00ff41"
read_only          = " 󰌾"
read_only_style    = "bold #f7768e"
truncation_length  = 4
truncate_to_repo   = true
format             = "[󰉋 $path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"~/go/src"   = "󰟓 go/src"
"~/.kube"    = "󱃾 .kube"
"~/projects" = " projects"
"~"          = "~"

# ─── GIT ─────────────────────────────────────────────────────────────────────
[git_branch]
symbol            = "  "          # recognizable Nerd Font branch icon
style             = "bold #bb9af7"
truncation_length = 24
format            = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style      = "bold #f7768e"
format     = "([$all_status$ahead_behind]($style) )"
conflicted = "⚡"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = " "
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

[custom.git_protected]
command     = "true"
when        = "git symbolic-ref --short HEAD 2>/dev/null | grep -qE '^(main|master|production|prod)$'"
style       = "bold #ff9e64"
format      = "[⚠]($style) "
description = "Alerte si branche courante = main/master/production"

[git_state]
style         = "bold #ff9e64"
format        = "\\([$state( $progress_current/$progress_total)]($style)\\) "

[git_metrics]
added_style   = "bold #9ece6a"
deleted_style = "bold #f7768e"
format        = "([+$added]($added_style) [-$deleted]($deleted_style) )"
disabled      = false

# ─── KUBERNETES ──────────────────────────────────────────────────────────────
[kubernetes]
disabled = false
symbol   = "󱃾 "
style    = "bold italic #73daca"
format   = "[$symbol$context( \\[$namespace\\])]($style) "

# Color-code by environment
[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style           = "bold #f7768e"
context_alias   = "PROD"

[[kubernetes.contexts]]
context_pattern = ".*staging.*"
style           = "bold #ff9e64"
context_alias   = "staging"

[[kubernetes.contexts]]
context_pattern = ".*dev.*"
style           = "bold #9ece6a"
context_alias   = "dev"

# ─── HELM ────────────────────────────────────────────────────────────────────
# Starship has no native Helm module -> surfaced through a custom one
[custom.helm]
command     = "helm version --short 2>/dev/null | grep -oP 'v[0-9]+\\.[0-9]+\\.[0-9]+'"
when        = "command -v helm"
symbol      = "⎈ "
style       = "bold #e0af68"
format      = "[$symbol($output)]($style) "
description = "Helm version"

# ─── TERRAFORM / OPENTOFU ────────────────────────────────────────────────────
# Starship's module is still named `terraform`; it detects *.tf / .terraform
# regardless of which binary (terraform or tofu) manages them.
[terraform]
disabled    = false
symbol      = "󱁢 "
style       = "bold #9d7cd8"
format      = "[$symbol$workspace]($style) "

# ─── DOCKER ──────────────────────────────────────────────────────────────────
[docker_context]
disabled = false
symbol   = " "
style    = "bold #9ece6a"
format   = "[$symbol$context]($style) "
only_with_files = false

# ─── ANSIBLE ─────────────────────────────────────────────────────────────────
[custom.ansible]
command     = "ansible --version 2>/dev/null | head -1 | awk '{print $2}' | tr -d '['"
when        = "[[ -f ansible.cfg || -f playbook.yml || -f site.yml ]]"
symbol      = "  "
style       = "bold #f7768e"
format      = "[$symbol($output)]($style) "
description = "Ansible version (si fichier présent)"

# ─── GOLANG ──────────────────────────────────────────────────────────────────
[golang]
symbol   = " "
style    = "bold #9d7cd8"
format   = "[$symbol($version)]($style) "
disabled = false

# ─── RUST ────────────────────────────────────────────────────────────────────
[rust]
symbol   = "🦀 "
style    = "bold #ff9e64"
format   = "[$symbol($version)]($style) "
disabled = false

# ─── PYTHON ──────────────────────────────────────────────────────────────────
[python]
symbol          = " "
style           = "bold #e0af68"
format          = "[$symbol$pyenv_prefix($version)(\\($virtualenv\\))]($style) "
detect_files    = ["requirements.txt", "setup.py", "pyproject.toml", "Pipfile", ".python-version"]
disabled        = false

# ─── SHELLS IMBRIQUÉS ────────────────────────────────────────────────────────
[shlvl]
disabled       = false
threshold      = 2          # n'affiche qu'à partir de 2 niveaux imbriqués
symbol         = "↕ "
style          = "bold #ff9e64"
format         = "[$symbol$shlvl]($style) "

# ─── JOBS EN ARRIÈRE-PLAN ────────────────────────────────────────────────────
[jobs]
disabled       = false
threshold      = 1
symbol         = "✦ "
style          = "bold #9d7cd8"
format         = "[$symbol$number]($style) "

# ─── DURÉE DE COMMANDE ───────────────────────────────────────────────────────
[cmd_duration]
min_time   = 2000          # affiche si > 2s
style      = "bold #e0af68"
format     = "[ $duration]($style) "

# ─── HEURE ───────────────────────────────────────────────────────────────────
[time]
disabled    = false
style       = "bold #565f89"
time_format = "%H:%M"
format      = "[$time]($style)"

# ─── CODE DE SORTIE ──────────────────────────────────────────────────────────
[status]
disabled      = false
style         = "bold #f7768e"
symbol        = "✖ "
format        = "[$symbol$status]($style) "

# ─── CARACTÈRE DE PROMPT ─────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol   = "[❯](bold #f7768e)"
vimcmd_symbol  = "[❮](bold #7aa2f7)"

# ─── DISABLED MODULES (keeps the prompt light) ───────────────────────────────
[package]
disabled = true     # version package.json trop verbeux

[aws]
disabled = true     # activer si tu utilises AWS

[azure]
disabled = true     # activer si tu utilises Azure

[gcloud]
disabled = true     # activer si tu utilises GCP

[nodejs]
disabled = true

[ruby]
disabled = true

[java]
disabled = true
