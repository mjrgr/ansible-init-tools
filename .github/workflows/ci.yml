name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: pipx install ansible-lint && pipx inject ansible-lint ansible-core && pip install yamllint

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint playbooks/

      - name: Syntax check
        run: |
          for pb in playbooks/*.yml; do
            ansible-playbook "$pb" --syntax-check -c local -i localhost,
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  # 22.04 ships ansible-core 2.12 and 26.04 ships 2.16; they do not behave the same,
  # and only a matrix catches the difference before a real machine does.
  dotfiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '26.04']
    steps:
      - uses: actions/checkout@v7

      # Deploys onto a pristine $HOME and asserts a second run reports changed=0.
      - name: Deploy and assert idempotence
        run: ./test/run.sh dotfiles
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}

  rollback:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '26.04']
    steps:
      - uses: actions/checkout@v7

      # Seeds real files, deploys, rolls back, asserts the originals came back
      # to the right directories.
      - name: Deploy and roll back
        run: ./test/run.sh rollback
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}

  pins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '26.04']
    steps:
      - uses: actions/checkout@v7

      # Dependabot cannot watch tool versions living in Ansible defaults, so this
      # is the only thing standing between a yanked tag and a broken bootstrap.
      - name: Install every pinned version
        run: ./test/run.sh pins
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}

  wezterm-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Parses the versioned wezterm.lua with the real binary.
      - name: Parse wezterm.lua
        run: ./test/run.sh wezterm

  # Not part of the CI gate: it reports what upstream has moved on to, on a
  # schedule, because nothing else watches versions that live in Ansible defaults.
  pin-drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Compare the pins against upstream
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./test/pin-drift.sh > /tmp/drift.md && status=0 || status=$?
          cat /tmp/drift.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One issue, edited in place. A weekly comment on the same issue would bury
      # the current state under a history nobody reads.
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Pinned CLI versions are behind upstream
        run: |
          set -euo pipefail
          gh label create pin-drift --color ededed --description "Pinned tool versions lag upstream" --force
          existing=$(gh issue list --label pin-drift --state open --json number --jq '.[0].number // empty')
          if [ "${{ steps.drift.outputs.status }}" = 0 ]; then
            [ -n "$existing" ] && gh issue close "$existing" --comment "Every pin matches upstream again." || true
            exit 0
          fi
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat /tmp/drift.md
            echo
            echo "Bump the \`<role>_version\` defaults, then \`make test-pins\`."
          } > /tmp/issue.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/issue.md
          else
            gh issue create --title "$TITLE" --label pin-drift --body-file /tmp/issue.md
          fi
