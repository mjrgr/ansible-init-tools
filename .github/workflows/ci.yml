name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# Actions are pinned by commit SHA, not by tag: a tag is mutable, and an action
# runs with this workflow's permissions. Dependabot bumps the SHAs and keeps the
# version in the trailing comment honest.
#
# MISE_GITHUB_TOKEN: the github backend (kwok, kubectl-cnpg, krelay, gitlogue, argo9s)
# reads release metadata from api.github.com, whose anonymous quota a shared
# runner egress burns through. The workflow token costs nothing and is scoped
# to this run.
env:
  MISE_GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yamllint and the pinned mise
        run: |
          pip install yamllint
          ./scripts/bootstrap.sh --skip podman,wezterm,vscode
          mise trust -q mise/config.toml

      - name: shellcheck, yamllint, config parse, lock audit
        run: make lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  # Three distros, because the bootstrap branches on the package manager and the
  # glibc each one ships is what the downloaded binaries link against. arm64
  # rides on the current Ubuntu LTS only.
  dotfiles:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: memex (a herdr plugin) has no prebuilt for its glibc and its
          # source build needs a gcc newer than 11, so the plugins are skipped there.
          - {image: 'ubuntu:22.04', runner: ubuntu-latest, herdr_plugins: 'false'}
          - {image: 'ubuntu:26.04', runner: ubuntu-latest}
          - {image: 'fedora:43', runner: ubuntu-latest}
          - {image: 'ubuntu:26.04', runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Deploys onto a pristine $HOME and asserts a second run changes nothing.
      - name: Bootstrap, deploy and assert idempotence
        run: ./test/run.sh dotfiles
        env:
          BASE_IMAGE: ${{ matrix.image }}
          DOTFILES_HERDR_PLUGINS: ${{ matrix.herdr_plugins || 'true' }}

  rollback:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'ubuntu:22.04', runner: ubuntu-latest, herdr_plugins: 'false'}
          - {image: 'ubuntu:26.04', runner: ubuntu-latest}
          - {image: 'fedora:43', runner: ubuntu-latest}
          - {image: 'ubuntu:26.04', runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Seeds real files, deploys, rolls back, asserts the originals came back
      # to the right directories.
      - name: Deploy and roll back
        run: ./test/run.sh rollback
        env:
          BASE_IMAGE: ${{ matrix.image }}
          DOTFILES_HERDR_PLUGINS: ${{ matrix.herdr_plugins || 'true' }}

  # Every pinned tool from mise.lock, then again: the second pass must install
  # nothing, every binary must run, and the lock must come out of it unchanged.
  clis:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'ubuntu:22.04', runner: ubuntu-latest}
          - {image: 'ubuntu:26.04', runner: ubuntu-latest}
          - {image: 'fedora:43', runner: ubuntu-latest}
          - {image: 'ubuntu:26.04', runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install every tool, twice
        run: ./test/run.sh clis
        env:
          BASE_IMAGE: ${{ matrix.image }}

  wezterm-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Parses the versioned wezterm.lua with the real binary.
      - name: Parse wezterm.lua
        run: ./test/run.sh wezterm

  # Re-resolves every locked URL and digest against upstream. A diff means an
  # artefact that was supposed to be immutable was rewritten — worth knowing
  # about, and not something a PR should pay for.
  lock-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Locked assets still hash to what the repo says
        run: |
          ./scripts/bootstrap.sh --skip podman,wezterm,vscode
          mise trust -q mise/config.toml
          mise lock
          git diff --exit-code mise/mise.lock

  # Not part of the CI gate. On the schedule (from main only: a dispatch on the
  # bump branch must not bump it again), it moves every pin to upstream's latest
  # and keeps one PR carrying the diff. A push made with the workflow token
  # triggers no pull_request run, so CI is dispatched on the branch by hand.
  pin-bump:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: bump/pins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Move every pin to upstream's latest
        id: bump
        env:
          MISE_YES: '1'
          # The task would first install all the tools; the bump installs what moved.
          MISE_TASK_RUN_AUTO_INSTALL: 'false'
        run: |
          ./scripts/bootstrap.sh --skip podman,wezterm,vscode
          mise trust -q mise/config.toml
          mise run bump
          {
            echo "| tool | from | to |"
            echo "|---|---|---|"
            git diff -U0 mise/config.toml | python3 - <<'PY'
          import re, sys
          old, new = {}, {}
          for line in sys.stdin:
              m = re.match(r'^([-+])([\w-]+) = (?:"([^"]+)"|\{ version = "([^"]+)")', line)
              if m:
                  (old if m[1] == "-" else new)[m[2]] = m[3] or m[4]
          for tool in sorted(new):
              print(f"| {tool} | {old.get(tool, '?')} | {new[tool]} |")
          PY
          } > /tmp/bump.md
          cat /tmp/bump.md >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet mise/; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"

      - name: Push the branch and open or update the PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'chore: bump pins to upstream'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "$TITLE"
          git push -f -u origin "$BRANCH"
          {
            cat /tmp/bump.md
            echo
            echo "Bumped by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }};"
            echo "the CI run dispatched on this branch is what validates it on the four targets."
            echo "Merge when green (ff-only), then \`git pull && make install\` on each host."
          } > /tmp/pr.md
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/pr.md
          else
            gh pr create --title "$TITLE" --body-file /tmp/pr.md --base main --head "$BRANCH"
          fi
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Close the PR when every pin matches upstream again
        if: steps.bump.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -z "$existing" ] || gh pr close "$existing" --delete-branch --comment "Every pin matches upstream again."
