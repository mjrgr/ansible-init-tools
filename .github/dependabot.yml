version: 2

updates:
  # Action tags drift silently and are a supply-chain surface: a compromised or
  # abandoned action runs with the workflow's permissions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # Base image of the container test bed.
  - package-ecosystem: docker
    directory: /test
    schedule:
      interval: weekly
    commit-message:
      prefix: test
    labels:
      - dependencies
