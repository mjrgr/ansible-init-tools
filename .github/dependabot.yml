version: 2

updates:
  # Actions are pinned by commit SHA in the workflow, which stops a moved tag
  # from changing what runs with the workflow's permissions — and leaves nothing
  # watching for the updates a tag used to deliver. This is that watcher.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies

# No docker entry: test/Dockerfile interpolates its base image from an ARG so the
# suite can run across LTS releases, and dependabot cannot parse that FROM. The
# versions under test are listed explicitly in the CI matrix instead.
