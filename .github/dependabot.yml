version: 2

updates:
  # Action tags drift silently and are a supply-chain surface: a compromised or
  # abandoned action runs with the workflow's permissions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies

# No docker entry: test/Dockerfile interpolates its base image from an ARG so the
# suite can run across LTS releases, and dependabot cannot parse that FROM. The
# versions under test are listed explicitly in the CI matrix instead.
