- name: Roll back the dotfiles deployment
  hosts: localhost
  become: false
  vars:
    dotfiles_src: "{{ playbook_dir | dirname }}/dotfiles"
    dotfiles_home: "{{ ansible_env.HOME }}"
    dotfiles_backup_dir: "{{ ansible_env.HOME }}/.dotfiles-backup"
    rb_claude_settings: "{{ ansible_env.HOME }}/.claude/settings.json"

    # The Claude Code events dotfiles_wezterm registers. Authoritative here the
    # same way dotfiles_links is: it is what the deploy may have written, and
    # keeping the two lists in step is what makes the rollback complete.
    rb_claude_hook_events:
      - UserPromptSubmit
      - Stop
      - Notification
      - SessionStart
      - SessionEnd

    # Authoritative list of what the deploy may have symlinked. Backups are named
    # after the basename only, so this mapping is what puts a restored file back in
    # the right directory — ~/.config/starship.toml, not ~/starship.toml.
    dotfiles_links:
      - "{{ dotfiles_home }}/.zshrc"
      - "{{ dotfiles_home }}/.zshenv"
      - "{{ dotfiles_home }}/.tmux.conf"
      - "{{ dotfiles_home }}/.gitconfig"
      - "{{ dotfiles_home }}/.config/starship.toml"
      - "{{ dotfiles_home }}/.config/zsh/wezterm.zsh"
      - "{{ dotfiles_home }}/.config/wezterm/wezterm.lua"
      - "{{ dotfiles_home }}/.config/wezterm/claude-state-hook.sh"
      - "{{ dotfiles_home }}/.config/btop/btop.conf"
      - "{{ dotfiles_home }}/.config/herdr/config.toml"
      - "{{ dotfiles_home }}/.config/herdr/herd-publish.sh"
      - "{{ dotfiles_home }}/.config/systemd/user/herd-publish.service"
      - "{{ dotfiles_home }}/.kube/k8s-clusters.sh"

  tasks:
    - name: "Inspect the deployed paths"
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ dotfiles_links }}"
      register: rb_stat

    # Only links pointing into this repo are ours. Anything else in those paths
    # predates the deploy or belongs to another tool, and is left alone.
    - name: "Remove the symlinks this repo owns"
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ rb_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists | default(false)
        - item.stat.islnk | default(false)
        - dotfiles_src in (item.stat.lnk_target | default(''))
      register: rb_removed

    - name: "Restore the most recent backup of each file"
      ansible.builtin.shell: |
        set -euo pipefail
        newest=$(ls -1t -- "{{ dotfiles_backup_dir }}/{{ item | basename }}".* 2>/dev/null | head -1) || true
        if [ -z "${newest:-}" ]; then
          echo "no backup for {{ item | basename }}"
          exit 0
        fi
        if [ -e "{{ item }}" ]; then
          echo "{{ item }} still present, not overwriting"
          exit 0
        fi
        mkdir -p -- "$(dirname -- "{{ item }}")"
        cp -a -- "$newest" "{{ item }}"
        echo "restored {{ item }} from $(basename -- "$newest")"
      args:
        executable: /bin/bash
      loop: "{{ dotfiles_links }}"
      loop_control:
        label: "{{ item | basename }}"
      register: rb_restore
      changed_when: "'restored ' in rb_restore.stdout"

    # settings.json was merged, not symlinked, so there is nothing to unlink.
    # Un-registering means taking our own event keys back out and leaving the
    # rest of the user's file — tokens, statusLine, plugins — alone. The deploy
    # owns those keys whole, so the rollback drops them whole.
    - name: "Look for the Claude Code settings.json"
      ansible.builtin.stat:
        path: "{{ rb_claude_settings }}"
      register: rb_settings_stat

    - name: "Read the Claude Code settings.json"
      ansible.builtin.slurp:
        src: "{{ rb_claude_settings }}"
      register: rb_settings_raw
      when: rb_settings_stat.stat.exists
      no_log: true

    - name: "Strip the wezterm state hooks out of settings.json"
      ansible.builtin.copy:
        content: "{{ rb_stripped | to_nice_json }}\n"
        dest: "{{ rb_claude_settings }}"
        mode: "0600"
      vars:
        rb_current: "{{ rb_settings_raw.content | b64decode | from_json }}"
        rb_kept: >-
          {{ rb_current.hooks | default({}) | dict2items
             | rejectattr('key', 'in', rb_claude_hook_events) | items2dict }}
        # An empty hooks object is noise in the file; drop the key outright.
        rb_stripped: >-
          {{ rb_current | combine({'hooks': rb_kept}) if rb_kept
             else rb_current | dict2items | rejectattr('key', 'eq', 'hooks') | items2dict }}
      when:
        - rb_settings_stat.stat.exists
        - (rb_settings_raw.content | b64decode | from_json) is mapping
      diff: false

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          {{ (rb_restore.results | default([]) | map(attribute='stdout') | list) }}
          | Backups kept in {{ dotfiles_backup_dir }}, nothing deleted.
          Claude Code state hooks un-registered from {{ rb_claude_settings }}.
          ~/.zshenv.local, ~/.zshrc.local and ~/.gitconfig.local untouched.
