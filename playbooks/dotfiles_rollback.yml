- name: Roll back the dotfiles deployment
  hosts: localhost
  become: false
  vars:
    dotfiles_src: "{{ playbook_dir | dirname }}/dotfiles"
    dotfiles_home: "{{ ansible_env.HOME }}"
    dotfiles_backup_dir: "{{ ansible_env.HOME }}/.dotfiles-backup"

    # Authoritative list of what the deploy may have symlinked. Backups are named
    # after the basename only, so this mapping is what puts a restored file back in
    # the right directory — ~/.config/starship.toml, not ~/starship.toml.
    dotfiles_links:
      - "{{ dotfiles_home }}/.zshrc"
      - "{{ dotfiles_home }}/.zshenv"
      - "{{ dotfiles_home }}/.tmux.conf"
      - "{{ dotfiles_home }}/.gitconfig"
      - "{{ dotfiles_home }}/.config/starship.toml"
      - "{{ dotfiles_home }}/.config/zsh/wezterm.zsh"
      - "{{ dotfiles_home }}/.config/wezterm/wezterm.lua"
      - "{{ dotfiles_home }}/.kube/k8s-clusters.sh"

  tasks:
    - name: "Inspect the deployed paths"
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: "{{ dotfiles_links }}"
      register: rb_stat

    # Only links pointing into this repo are ours. Anything else in those paths
    # predates the deploy or belongs to another tool, and is left alone.
    - name: "Remove the symlinks this repo owns"
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ rb_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists | default(false)
        - item.stat.islnk | default(false)
        - dotfiles_src in (item.stat.lnk_target | default(''))
      register: rb_removed

    - name: "Restore the most recent backup of each file"
      ansible.builtin.shell: |
        set -euo pipefail
        newest=$(ls -1t -- "{{ dotfiles_backup_dir }}/{{ item | basename }}".* 2>/dev/null | head -1) || true
        if [ -z "${newest:-}" ]; then
          echo "no backup for {{ item | basename }}"
          exit 0
        fi
        if [ -e "{{ item }}" ]; then
          echo "{{ item }} still present, not overwriting"
          exit 0
        fi
        mkdir -p -- "$(dirname -- "{{ item }}")"
        cp -a -- "$newest" "{{ item }}"
        echo "restored {{ item }} from $(basename -- "$newest")"
      args:
        executable: /bin/bash
      loop: "{{ dotfiles_links }}"
      loop_control:
        label: "{{ item | basename }}"
      register: rb_restore
      changed_when: "'restored ' in rb_restore.stdout"

    - name: "Report"
      ansible.builtin.debug:
        msg: >-
          {{ (rb_restore.results | default([]) | map(attribute='stdout') | list) }}
          | Backups kept in {{ dotfiles_backup_dir }}, nothing deleted.
          ~/.zshenv.local, ~/.zshrc.local and ~/.gitconfig.local untouched.
