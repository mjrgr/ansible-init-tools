- name: Install CLIs on localhost
  hosts: localhost
  become: true
  vars:
    # present = install only what is missing (default)
    # latest  = re-run every installer and upgrade in place
    clis_state: present

    install_list:
      - kubectl
      - helm
      - kind
      - kwok
      - k9s
      - docker
      - podman
      - krew
      - helmfile
      - nerdctl
      - crictl
      - terraform
      - copilot
      - yq
      - jq
      - gh
      - sops
      - starship
      - wezterm

    common_packages:
      - git
      - curl
      - wget
      - gnupg
      - unzip
      - zsh
      - fzf
      - age
      - fontconfig
      - apt-transport-https
      - ca-certificates
      - software-properties-common
      - lsb-release

  tasks:
    - name: "Refuse to run on a non-Debian family"
      ansible.builtin.fail:
        msg: >-
          This playbook targets Debian/Ubuntu (apt). Detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          (family {{ ansible_os_family }}).
      when: ansible_os_family != 'Debian'
      tags: [always]

    # No cache_valid_time here: it trusts the mtime of /var/lib/apt/lists, which
    # is recent but empty on an image that purged the lists after building. Ansible
    # then skips the update and the install fails on packages it cannot see.
    - name: "Install common tools/dependencies"
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
        update_cache: true
      tags: [common]

    - name: "Ensure the apt keyring directory exists"
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      tags: [always]

    - name: "Choose which roles to run (optional: use install_only=NAME)"
      ansible.builtin.set_fact:
        to_install: "{{ install_list if (install_only is not defined) else [install_only] }}"
      tags: [always]

    # Same reason as in dotfiles.yml: `item` inside apply.tags resolves against the
    # included role's own loop, not this one.
    - name: "Run role for each tool"
      ansible.builtin.include_role:
        name: "{{ clis_tool }}"
        apply:
          tags: ["{{ clis_tool }}"]
      loop: "{{ to_install }}"
      loop_control:
        loop_var: clis_tool
      tags: [tools]
