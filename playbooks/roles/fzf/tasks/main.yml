---
# role: fzf

- name: "Resolve the fzf version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: fzf
    clis_repo: junegunn/fzf
    clis_target: "{{ fzf_version }}"

- name: "Decide whether fzf must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: fzf
    clis_bin: /usr/local/bin/fzf
    clis_target: "{{ fzf_version }}"

- name: "Install fzf"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: fzf
    clis_url: "{{ fzf_url }}"
    clis_arch_map: "{{ fzf_arch }}"
    clis_sha256: "{{ fzf_sha256[clis_arch] }}"
    clis_files:
      - {src: "fzf", dest: "/usr/local/bin/fzf"}
  when: clis_need_install | bool
