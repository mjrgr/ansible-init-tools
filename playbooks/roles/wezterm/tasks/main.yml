---
# role: wezterm
# Official apt repository — the distro packages lag several releases behind.

- name: "Check for an already dearmored WezTerm key"
  ansible.builtin.stat:
    path: /etc/apt/keyrings/wezterm-fury.gpg
  register: wezterm_keyring

- name: "Fetch the WezTerm signing key"
  ansible.builtin.get_url:
    url: https://apt.fury.io/wez/gpg.key
    dest: /etc/apt/keyrings/wezterm-fury.gpg.armored
    mode: "0644"
  register: wezterm_key_fetch
  retries: 3
  delay: 5
  until: wezterm_key_fetch is succeeded
  when: not wezterm_keyring.stat.exists

- name: "Dearmor the WezTerm signing key"
  ansible.builtin.shell: |
    set -euo pipefail
    gpg --yes --dearmor -o /etc/apt/keyrings/wezterm-fury.gpg \
      /etc/apt/keyrings/wezterm-fury.gpg.armored
    chmod 644 /etc/apt/keyrings/wezterm-fury.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/wezterm-fury.gpg

# apt_repository appends rather than replaces: if this repo was ever added by
# hand under a different keyring filename, the old line stays and apt refuses
# the file over the Signed-By mismatch. Starting from a clean file makes this
# idempotent regardless of what pre-existed.
- name: "Remove any pre-existing WezTerm apt source"
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/wezterm-fury.list
    state: absent

- name: "Add the WezTerm apt source"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *"
    filename: wezterm-fury
    state: present

- name: "Install wezterm"
  ansible.builtin.apt:
    name: wezterm
    state: present
    update_cache: true
