---
# role: yq
- name: "Decide whether yq must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: yq
    clis_bin: /usr/local/bin/yq
    clis_target: "{{ yq_version }}"

- name: "Install yq"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ yq_version }}"
    if [ "$VERSION" = latest ]; then
      URL=https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
    else
      URL="https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64"
    fi
    curl -fsSL -o /usr/local/bin/yq "$URL"
    chmod +x /usr/local/bin/yq
    /usr/local/bin/yq --version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
