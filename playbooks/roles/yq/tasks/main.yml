---
# role: yq

- name: "Resolve the yq version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: yq
    clis_repo: mikefarah/yq
    clis_target: "{{ yq_version }}"

- name: "Decide whether yq must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: yq
    clis_bin: /usr/local/bin/yq
    clis_target: "{{ yq_version }}"

- name: "Install yq"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: yq
    clis_url: "{{ yq_url }}"
    clis_arch_map: "{{ yq_arch }}"
    clis_sha256: "{{ yq_sha256[clis_arch] }}"
    clis_dest: /usr/local/bin/yq
  when: clis_need_install | bool
