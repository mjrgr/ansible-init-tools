---
# role: k0sctl

- name: "Resolve the k0sctl version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: k0sctl
    clis_repo: k0sproject/k0sctl
    clis_target: "{{ k0sctl_version }}"

- name: "Decide whether k0sctl must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: k0sctl
    clis_bin: /usr/local/bin/k0sctl
    clis_version_cmd: "/usr/local/bin/k0sctl version"
    clis_target: "{{ k0sctl_version }}"

- name: "Install k0sctl"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: k0sctl
    clis_url: "{{ k0sctl_url }}"
    clis_arch_map: "{{ k0sctl_arch }}"
    clis_sha256: "{{ k0sctl_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/k0sctl version"
    clis_dest: /usr/local/bin/k0sctl
  when: clis_need_install | bool
