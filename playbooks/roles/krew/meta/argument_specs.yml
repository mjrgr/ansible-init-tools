---
# Turns a malformed override into a named failure at include time, rather
# than a 404 halfway through a download.
argument_specs:
  main:
    short_description: Install krew
    options:
      krew_version:
        type: str
        required: true
        description: Release tag to bootstrap from, or "latest" to track upstream.
      krew_root:
        type: str
        required: true
        description: KREW_ROOT of the invoking user; krew and its plugins live there.
      krew_arch:
        type: dict
        required: true
        description: Upstream's own spelling of each target architecture.
      krew_url:
        type: str
        required: true
        description: Download template; {version}, {version_nov} and {arch} are substituted.
      krew_sha256:
        type: dict
        required: true
        description: Expected digest per architecture. Empty means the download is unverified.
      krew_plugins:
        type: list
        elements: str
        required: true
        description: Plugins installed when missing; extra ones are left alone.
