---
# role: krew

- name: "Resolve the krew version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: krew
    clis_repo: kubernetes-sigs/krew
    clis_target: "{{ krew_version }}"

# `krew version` leads with a multi-line PATH warning, then a table;
# the GitTag row is the only place the version appears.
- name: "Decide whether krew must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: krew
    clis_bin: /usr/local/bin/kubectl-krew
    clis_version_cmd: "/usr/local/bin/kubectl-krew version 2>&1 | awk '/GitTag/ {print $2}'"
    clis_target: "{{ krew_version }}"

- name: "Install krew"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: krew
    clis_url: "{{ krew_url }}"
    clis_arch_map: "{{ krew_arch }}"
    clis_sha256: "{{ krew_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/kubectl-krew version"
    clis_files:
      - {src: "krew-linux_{{ krew_arch[clis_arch] }}", dest: "/usr/local/bin/kubectl-krew"}
  when: clis_need_install | bool
