---
# role: krew
- name: "Decide whether krew must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: krew
    clis_bin: /usr/local/bin/kubectl-krew
    clis_target: "{{ krew_version }}"
    # `krew version` leads with a multi-line PATH warning, then a table;
    # the GitTag row is the only place the version appears.
    clis_version_cmd: "/usr/local/bin/kubectl-krew version 2>&1 | awk '/GitTag/ {print $2}'"

- name: "Install krew"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ krew_version }}"
    OS="$(uname | tr '[:upper:]' '[:lower:]')"
    ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64$/arm64/')"
    KREW="krew-${OS}_${ARCH}"
    if [ "$VERSION" = latest ]; then BASE=https://github.com/kubernetes-sigs/krew/releases/latest/download
    else BASE="https://github.com/kubernetes-sigs/krew/releases/download/${VERSION}"; fi
    TMP="$(mktemp -d)"
    curl -fsSL -o "${TMP}/${KREW}.tar.gz" "${BASE}/${KREW}.tar.gz"
    tar zxf "${TMP}/${KREW}.tar.gz" -C "$TMP"
    install -m 0755 "${TMP}/${KREW}" /usr/local/bin/kubectl-krew
    rm -rf "$TMP"
    /usr/local/bin/kubectl-krew version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
