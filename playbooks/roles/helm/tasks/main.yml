---
# role: helm
- name: "Decide whether helm must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: helm
    clis_bin: helm
    clis_target: "{{ helm_version }}"
    clis_version_cmd: "helm version --short"

- name: "Install helm"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ helm_version }}"
    curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 -o /tmp/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    chmod +x /tmp/get_helm.sh
    if [ "$VERSION" = latest ]; then /tmp/get_helm.sh; else /tmp/get_helm.sh --version "$VERSION"; fi
    rm -f /tmp/get_helm.sh
    helm version --short
  args:
    executable: /bin/bash
  when: clis_need_install | bool
