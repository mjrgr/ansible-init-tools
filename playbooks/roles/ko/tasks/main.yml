---
# role: ko

- name: "Resolve the ko version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: ko
    clis_repo: ko-build/ko
    clis_target: "{{ ko_version }}"

- name: "Decide whether ko must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: ko
    clis_bin: /usr/local/bin/ko
    clis_version_cmd: "/usr/local/bin/ko version"
    clis_target: "{{ ko_version }}"

- name: "Install ko"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: ko
    clis_url: "{{ ko_url }}"
    clis_arch_map: "{{ ko_arch }}"
    clis_sha256: "{{ ko_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/ko version"
    clis_files:
      - {src: "ko", dest: "/usr/local/bin/ko"}
  when: clis_need_install | bool
