---
# role: vcluster

- name: "Resolve the vcluster version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: vcluster
    clis_repo: loft-sh/vcluster
    clis_target: "{{ vcluster_version }}"

- name: "Decide whether vcluster must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: vcluster
    clis_bin: /usr/local/bin/vcluster
    clis_version_cmd: "/usr/local/bin/vcluster --version"
    clis_target: "{{ vcluster_version }}"

- name: "Install vcluster"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: vcluster
    clis_url: "{{ vcluster_url }}"
    clis_arch_map: "{{ vcluster_arch }}"
    clis_sha256: "{{ vcluster_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/vcluster --version"
    clis_dest: /usr/local/bin/vcluster
  when: clis_need_install | bool
