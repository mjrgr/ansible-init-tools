---
# role: glow
- name: "Decide whether glow must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: glow
    clis_bin: /usr/local/bin/glow
    clis_target: "{{ glow_version }}"

- name: "Install glow"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ glow_version }}"
    latest_tag() {
      curl -fsSLI --retry 3 --retry-all-errors --connect-timeout 15 -o /dev/null -w '%{url_effective}' "https://github.com/$1/releases/latest" \
        | sed 's#.*/tag/##'
    }
    [ "$VERSION" = latest ] && VERSION=$(latest_tag charmbracelet/glow)
    V="${VERSION#v}"
    curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 -o /tmp/glow.tar.gz \
      "https://github.com/charmbracelet/glow/releases/download/v${V}/glow_${V}_Linux_x86_64.tar.gz"
    tar xzf /tmp/glow.tar.gz -C /tmp --strip-components=1 "glow_${V}_Linux_x86_64/glow"
    install -m 0755 /tmp/glow /usr/local/bin/glow
    rm -f /tmp/glow.tar.gz /tmp/glow
    /usr/local/bin/glow --version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
