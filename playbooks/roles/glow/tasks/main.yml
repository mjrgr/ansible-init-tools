---
# role: glow

- name: "Resolve the glow version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: glow
    clis_repo: charmbracelet/glow
    clis_target: "{{ glow_version }}"

- name: "Decide whether glow must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: glow
    clis_bin: /usr/local/bin/glow
    clis_target: "{{ glow_version }}"

- name: "Install glow"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: glow
    clis_url: "{{ glow_url }}"
    clis_arch_map: "{{ glow_arch }}"
    clis_sha256: "{{ glow_sha256[clis_arch] }}"
    clis_files:
      - {src: "glow_{{ clis_version | regex_replace('^v', '') }}_Linux_{{ glow_arch[clis_arch] }}/glow", dest: "/usr/local/bin/glow"}
  when: clis_need_install | bool
