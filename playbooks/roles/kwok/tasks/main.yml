---
# role: kwok
# Two binaries from one release: kwok is the node simulator, kwokctl the cluster
# wrapper that drives it. Only kwok carries --version, so kwokctl rides on the
# same install decision rather than being probed separately.

- name: "Resolve the kwok version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: kwok
    clis_repo: kubernetes-sigs/kwok
    clis_target: "{{ kwok_version }}"

- name: "Decide whether kwok must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: kwok
    clis_bin: /usr/local/bin/kwok
    clis_target: "{{ kwok_version }}"

- name: "Install kwok"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: kwok
    clis_url: "{{ kwok_url }}"
    clis_arch_map: "{{ kwok_arch }}"
    clis_sha256: "{{ kwok_sha256[clis_arch] }}"
    clis_dest: /usr/local/bin/kwok
  when: clis_need_install | bool

- name: "Install kwokctl"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: kwok
    clis_url: "{{ kwokctl_url }}"
    clis_arch_map: "{{ kwok_arch }}"
    clis_sha256: "{{ kwokctl_sha256[clis_arch] }}"
    clis_dest: /usr/local/bin/kwokctl
  when: clis_need_install | bool
