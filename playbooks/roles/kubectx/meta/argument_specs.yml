---
argument_specs:
  main:
    short_description: Install kubectx
    options:
      kubectx_version:
        type: str
        required: true
        description: Release tag to install, or "latest" to track upstream.
      kubectx_arch:
        type: dict
        required: true
        description: Upstream's own spelling of each target architecture.
      kubectx_url:
        type: str
        required: true
        description: Download template; {version}, {version_nov} and {arch} are substituted.
      kubectx_sha256:
        type: dict
        required: true
        description: Expected digest per architecture. Empty means the download is unverified.
      kubectx_kubens_url:
        type: str
        required: true
        description: Download template for the kubens archive, same placeholders.
      kubectx_kubens_sha256:
        type: dict
        required: true
        description: Expected kubens digest per architecture.
