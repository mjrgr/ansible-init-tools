---
# role: helmfile

- name: "Resolve the helmfile version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: helmfile
    clis_repo: helmfile/helmfile
    clis_target: "{{ helmfile_version }}"

- name: "Decide whether helmfile must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: helmfile
    clis_bin: /usr/local/bin/helmfile
    clis_target: "{{ helmfile_version }}"

- name: "Install helmfile"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: helmfile
    clis_url: "{{ helmfile_url }}"
    clis_arch_map: "{{ helmfile_arch }}"
    clis_sha256: "{{ helmfile_sha256[clis_arch] }}"
    clis_files:
      - {src: "helmfile", dest: "/usr/local/bin/helmfile"}
  when: clis_need_install | bool
