---
# role: helmfile
- name: "Decide whether helmfile must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: helmfile
    clis_bin: /usr/local/bin/helmfile
    clis_target: "{{ helmfile_version }}"

- name: "Install helmfile"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ helmfile_version }}"
    # api.github.com allows 60 unauthenticated calls per hour per IP, which a
    # shared egress address burns through; the release redirect has no such limit.
    latest_tag() {
      curl -fsSLI --retry 3 --retry-all-errors --connect-timeout 15 -o /dev/null -w '%{url_effective}' "https://github.com/$1/releases/latest" \
        | sed 's#.*/tag/##'
    }
    [ "$VERSION" = latest ] && VERSION=$(latest_tag helmfile/helmfile)
    V="${VERSION#v}"
    curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 -o /tmp/helmfile.tar.gz \
      "https://github.com/helmfile/helmfile/releases/download/v${V}/helmfile_${V}_linux_amd64.tar.gz"
    tar xzf /tmp/helmfile.tar.gz -C /tmp helmfile
    install -m 0755 /tmp/helmfile /usr/local/bin/helmfile
    rm -f /tmp/helmfile.tar.gz /tmp/helmfile
    /usr/local/bin/helmfile --version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
