---
# role: terraform

- name: "Fetch the HashiCorp signing key"
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/hashicorp.gpg.armored
    mode: "0644"

- name: "Dearmor the HashiCorp signing key"
  ansible.builtin.shell: |
    set -euo pipefail
    gpg --yes --dearmor -o /etc/apt/keyrings/hashicorp.gpg /etc/apt/keyrings/hashicorp.gpg.armored
    chmod 644 /etc/apt/keyrings/hashicorp.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/hashicorp.gpg

- name: "Add the HashiCorp apt source"
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/hashicorp.gpg]
      https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main
    filename: hashicorp
    state: present

- name: "Install terraform"
  ansible.builtin.apt:
    name: "terraform{{ ('=' ~ terraform_version) if terraform_version != 'latest' else '' }}"
    state: "{{ 'latest' if (clis_state == 'latest' and terraform_version == 'latest') else 'present' }}"
    update_cache: true
