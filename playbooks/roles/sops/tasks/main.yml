
---
# role: SOPS
- name: Install SOPS
  ansible.builtin.shell: |
    set -euo pipefail
    echo "Installing SOPS (latest)..."
    # Get latest version dynamically from GitHub API
    SOPS_VERSION=$(curl -s https://api.github.com/repos/getsops/sops/releases/latest | grep '"tag_name"' | cut -d '"' -f4)
    echo "Latest version: ${SOPS_VERSION}"
    # Download the binary
    curl -fsSL -o /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
    # Make the binary executable
    chmod +x /usr/local/bin/sops
    sops --version || true
  args:
    executable: /bin/bash
  register: sops_install
  changed_when: "'already installed' not in sops_install.stdout.lower()"
