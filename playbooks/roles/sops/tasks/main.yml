---
# role: sops

- name: "Resolve the sops version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: sops
    clis_repo: getsops/sops
    clis_target: "{{ sops_version }}"

- name: "Decide whether sops must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: sops
    clis_bin: /usr/local/bin/sops
    clis_target: "{{ sops_version }}"

- name: "Install sops"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: sops
    clis_url: "{{ sops_url }}"
    clis_arch_map: "{{ sops_arch }}"
    clis_sha256: "{{ sops_sha256[clis_arch] }}"
    clis_dest: /usr/local/bin/sops
  when: clis_need_install | bool
