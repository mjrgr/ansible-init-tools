---
# role: sops
- name: "Decide whether sops must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: sops
    clis_bin: /usr/local/bin/sops
    clis_target: "{{ sops_version }}"

- name: "Install sops"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ sops_version }}"
    # api.github.com allows 60 unauthenticated calls per hour per IP, which a
    # shared egress address burns through; the release redirect has no such limit.
    latest_tag() {
      curl -fsSLI --retry 3 --retry-all-errors --connect-timeout 15 -o /dev/null -w '%{url_effective}' "https://github.com/$1/releases/latest" \
        | sed 's#.*/tag/##'
    }
    [ "$VERSION" = latest ] && VERSION=$(latest_tag getsops/sops)
    curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 -o /usr/local/bin/sops \
      "https://github.com/getsops/sops/releases/download/${VERSION}/sops-${VERSION}.linux.amd64"
    chmod +x /usr/local/bin/sops
    /usr/local/bin/sops --version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
