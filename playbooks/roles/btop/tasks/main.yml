---
# role: btop
# The distro package is several minors behind (noble ships 1.3.0), and the GPU
# panel only landed in 1.4. Upstream publishes a static musl build, so the
# release tarball is the shorter path to a current btop.
#
# The themes ship in that same tarball; btop finds them under
# <prefix>/share/btop/themes, which is why the binary goes to /usr/local/bin and
# the themes to /usr/local/share. Moving one without the other loses the theme.

- name: "Resolve the btop version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: btop
    clis_repo: aristocratos/btop
    clis_target: "{{ btop_version }}"

- name: "Decide whether btop must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: btop
    clis_bin: /usr/local/bin/btop
    clis_target: "{{ btop_version }}"

- name: "Install btop"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: btop
    clis_url: "{{ btop_url }}"
    clis_arch_map: "{{ btop_arch }}"
    clis_sha256: "{{ btop_sha256[clis_arch] }}"
    clis_files:
      - {src: "btop/bin/btop", dest: "/usr/local/bin/btop"}
    clis_trees:
      - {src: "btop/themes/", dest: "/usr/local/share/btop/themes"}
  when: clis_need_install | bool
