---
# role: kind
- name: "Decide whether kind must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: kind
    clis_bin: /usr/local/bin/kind
    clis_target: "{{ kind_version }}"

- name: "Install kind"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ kind_version }}"
    curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${VERSION}/kind-linux-amd64"
    chmod +x /usr/local/bin/kind
    /usr/local/bin/kind --version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
