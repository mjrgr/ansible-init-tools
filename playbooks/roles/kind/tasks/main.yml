---
# role: kind

- name: "Resolve the kind version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: kind
    clis_repo: kubernetes-sigs/kind
    clis_target: "{{ kind_version }}"

- name: "Decide whether kind must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: kind
    clis_bin: /usr/local/bin/kind
    clis_target: "{{ kind_version }}"

- name: "Install kind"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: kind
    clis_url: "{{ kind_url }}"
    clis_arch_map: "{{ kind_arch }}"
    clis_sha256: "{{ kind_sha256[clis_arch] }}"
    clis_dest: /usr/local/bin/kind
  when: clis_need_install | bool
