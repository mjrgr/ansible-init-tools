---
# role: trivy

- name: "Resolve the trivy version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: trivy
    clis_repo: aquasecurity/trivy
    clis_target: "{{ trivy_version }}"

- name: "Decide whether trivy must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: trivy
    clis_bin: /usr/local/bin/trivy
    clis_version_cmd: "/usr/local/bin/trivy --version"
    clis_target: "{{ trivy_version }}"

- name: "Install trivy"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: trivy
    clis_url: "{{ trivy_url }}"
    clis_arch_map: "{{ trivy_arch }}"
    clis_sha256: "{{ trivy_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/trivy --version"
    clis_files:
      - {src: "trivy", dest: "/usr/local/bin/trivy"}
  when: clis_need_install | bool
