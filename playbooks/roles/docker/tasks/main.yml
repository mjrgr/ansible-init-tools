---
# role: docker
# docker-ce does not exist in the Ubuntu/Debian archives — the repository below is
# what makes the package resolvable at all.

- name: "Fetch the Docker signing key"
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.gpg.armored
    mode: "0644"

- name: "Dearmor the Docker signing key"
  ansible.builtin.shell: |
    set -euo pipefail
    gpg --yes --dearmor -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.gpg.armored
    chmod 644 /etc/apt/keyrings/docker.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker.gpg

- name: "Add the Docker apt source"
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: "Install Docker Engine"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: "{{ 'latest' if clis_state == 'latest' else 'present' }}"
    update_cache: true
