---
# role: dotfiles_common — target directory tree + backup location

- name: "Check that the versioned dotfiles are present"  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ dotfiles_src }}/zsh/.zshrc"
  register: dotfiles_src_check

- name: "Fail if the dotfiles source is missing"
  ansible.builtin.fail:
    msg: "dotfiles_src not found: {{ dotfiles_src }} — run the playbook from the repo."
  when: not dotfiles_src_check.stat.exists

# Fail here rather than midway through the oh-my-zsh installer, which reports
# "Zsh is not installed" and leaves a half-built ~/.oh-my-zsh behind.
- name: "Check the prerequisites are installed"  # noqa: var-naming[no-role-prefix]
  ansible.builtin.shell: "command -v {{ item }}"
  args:
    executable: /bin/bash
  loop: "{{ dotfiles_requirements }}"
  register: dotfiles_reqs
  changed_when: false
  failed_when: false

- name: "Fail if a prerequisite is missing"
  ansible.builtin.fail:
    msg: >-
      Missing command(s):
      {{ dotfiles_reqs.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}.
      Run install_clis.yml first —
      ansible-playbook playbooks/install_clis.yml -c local --ask-become-pass
  when: dotfiles_reqs.results | selectattr('rc', 'ne', 0) | list | length > 0

- name: "Inspect the target directories"  # noqa: var-naming[no-role-prefix]
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ dotfiles_common_dirs }}"
  register: dotfiles_dirs

# mode is applied only to the directories this task actually creates. Under WSL
# ~/.kube is often a symlink onto the Windows drive, and a drvfs/9p mount carries
# no Linux metadata (uid=0, gid=0, everything 0777): chmod there always returns
# EPERM. Re-asserting 0755 on a directory that already exists and works would
# fail the whole play for nothing.
- name: "Create the missing target directories"
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    mode: "0755"
  loop: "{{ dotfiles_dirs.results }}"
  when: not item.stat.exists
  loop_control:
    label: "{{ item.item }}"
