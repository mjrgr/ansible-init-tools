---
# role: kubie

- name: "Resolve the kubie version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: kubie
    clis_repo: sbstp/kubie
    clis_target: "{{ kubie_version }}"

- name: "Decide whether kubie must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: kubie
    clis_bin: /usr/local/bin/kubie
    clis_version_cmd: "/usr/local/bin/kubie --version"
    clis_target: "{{ kubie_version }}"

- name: "Install kubie"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: kubie
    clis_url: "{{ kubie_url }}"
    clis_arch_map: "{{ kubie_arch }}"
    clis_sha256: "{{ kubie_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/kubie --version"
    clis_dest: /usr/local/bin/kubie
  when: clis_need_install | bool
