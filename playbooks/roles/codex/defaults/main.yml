---
# Pinned so two machines provisioned months apart get the same binary.
# Set to "latest" to track upstream, or override on the command line:
#   -e codex_version=<x.y.z>
# Bump deliberately, then re-run the container tests.
#
# Plain semver here, not the tag: upstream tags the CLI `rust-v<x.y.z>` in a
# monorepo that also ships other crates, and the probe compares against what
# `codex --version` prints. resolve.yml strips the prefix back off when the pin
# is "latest".
codex_version: "0.163.0"

# Upstream's own spelling of each target — no two projects agree on these.
codex_arch:
  amd64: "x86_64"
  arm64: "aarch64"

codex_url: "https://github.com/openai/codex/releases/download/rust-v{version}/codex-{arch}-unknown-linux-musl.tar.gz"
codex_host_url: "https://github.com/openai/codex/releases/download/rust-v{version}/codex-code-mode-host-{arch}-unknown-linux-musl.tar.gz"

# Verified on download, so a swapped asset fails the run instead of landing in
# /usr/local/bin. Regenerate with `make checksums` after bumping the version.
# Empty means unverified, which is what a "latest" pin necessarily gets.
codex_sha256:
  amd64: "beb339e8ecd9ba057a6bb2dc81ad8ca474812edfbf0fc5056ca818797648dde4"
  arm64: "a7261e65f4a96d8f4ca65a069c6cf2dc2c33defc341e48078acefda9461fffe4"

codex_host_sha256:
  amd64: "314263128ba6592e7e807c265deeaf928a692b72dcbfeb5e0b20c9423b703529"
  arm64: "284356aefb197f00b76b912efdfdbae8ccf3ea1f89b976dde064b7ccb43214ef"
