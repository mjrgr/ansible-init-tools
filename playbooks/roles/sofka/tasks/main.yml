---
# role: sofka

- name: "Resolve the sofka version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: sofka
    clis_repo: nklmilojevic/sofka
    clis_target: "{{ sofka_version }}"

- name: "Decide whether sofka must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: sofka
    clis_bin: /usr/local/bin/sofka
    clis_target: "{{ sofka_version }}"

- name: "Install sofka"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: sofka
    clis_url: "{{ sofka_url }}"
    clis_arch_map: "{{ sofka_arch }}"
    clis_sha256: "{{ sofka_sha256[clis_arch] }}"
    clis_files:
      - {src: "sofka", dest: "/usr/local/bin/sofka"}
  when: clis_need_install | bool
