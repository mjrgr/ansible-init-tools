---
# role: argo9s

- name: "Resolve the argo9s version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: argo9s
    clis_repo: vvrnv/argo9s
    clis_target: "{{ argo9s_version }}"

- name: "Decide whether argo9s must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: argo9s
    clis_bin: /usr/local/bin/argo9s
    clis_target: "{{ argo9s_version }}"

- name: "Install argo9s"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: argo9s
    clis_url: "{{ argo9s_url }}"
    clis_arch_map: "{{ argo9s_arch }}"
    clis_sha256: "{{ argo9s_sha256[clis_arch] }}"
    clis_files:
      - {src: "argo9s", dest: "/usr/local/bin/argo9s"}
  when: clis_need_install | bool
