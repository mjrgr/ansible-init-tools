---
# role: argo9s
- name: "Decide whether argo9s must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: argo9s
    clis_bin: /usr/local/bin/argo9s
    clis_target: "{{ argo9s_version }}"

- name: "Install argo9s"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ argo9s_version }}"
    latest_tag() {
      curl -fsSLI --retry 5 --retry-all-errors --retry-max-time 120 --connect-timeout 15 -o /dev/null -w '%{url_effective}' "https://github.com/$1/releases/latest" \
        | sed 's#.*/tag/##'
    }
    [ "$VERSION" = latest ] && VERSION=$(latest_tag vvrnv/argo9s)
    # The asset name carries the bare version, the tag carries the v.
    curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 --connect-timeout 15 -o /tmp/argo9s.tar.gz \
      "https://github.com/vvrnv/argo9s/releases/download/${VERSION}/argo9s_${VERSION#v}_linux_amd64.tar.gz"
    tar xzf /tmp/argo9s.tar.gz -C /tmp argo9s
    install -m 0755 /tmp/argo9s /usr/local/bin/argo9s
    rm -f /tmp/argo9s.tar.gz /tmp/argo9s
    /usr/local/bin/argo9s --version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
