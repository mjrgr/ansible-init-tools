---
# role: vhs
# Installs the vhs binary only. Recording tapes also needs ttyd and ffmpeg on
# PATH; vhs prints which one is missing the first time you run a .tape file.

- name: "Resolve the vhs version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: vhs
    clis_repo: charmbracelet/vhs
    clis_target: "{{ vhs_version }}"

- name: "Decide whether vhs must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: vhs
    clis_bin: /usr/local/bin/vhs
    clis_target: "{{ vhs_version }}"

- name: "Install vhs"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: vhs
    clis_url: "{{ vhs_url }}"
    clis_arch_map: "{{ vhs_arch }}"
    clis_sha256: "{{ vhs_sha256[clis_arch] }}"
    clis_files:
      - {src: "vhs_{{ clis_version | regex_replace('^v', '') }}_Linux_{{ vhs_arch[clis_arch] }}/vhs", dest: "/usr/local/bin/vhs"}
  when: clis_need_install | bool
