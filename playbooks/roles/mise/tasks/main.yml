---
# role: mise

- name: "Resolve the mise version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: mise
    clis_repo: jdx/mise
    clis_target: "{{ mise_version }}"

# stderr dropped: `mise --version` can print a "newer version available" warning holding another version number.
- name: "Decide whether mise must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: mise
    clis_bin: /usr/local/bin/mise
    clis_version_cmd: "/usr/local/bin/mise --version 2>/dev/null"
    clis_target: "{{ mise_version }}"

- name: "Install mise"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: mise
    clis_url: "{{ mise_url }}"
    clis_arch_map: "{{ mise_arch }}"
    clis_sha256: "{{ mise_sha256[clis_arch] }}"
    clis_dest: /usr/local/bin/mise
  when: clis_need_install | bool
