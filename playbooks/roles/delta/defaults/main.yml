---
# Pinned so two machines provisioned months apart get the same binary.
# Set to "latest" to track upstream, or override on the command line:
#   -e delta_version=<tag>
# Bump deliberately, then re-run the container tests.
#
# Upstream tags delta without a leading "v" — the probe strips one if present,
# so both forms compare correctly, but the download URL needs the tag verbatim.
delta_version: "0.20.1"

# Upstream's own spelling of each target — no two projects agree on these.
delta_arch:
  amd64: "x86_64-unknown-linux-gnu"
  arm64: "aarch64-unknown-linux-gnu"

delta_url: "https://github.com/dandavison/delta/releases/download/{version}/delta-{version}-{arch}.tar.gz"

# Verified on download, so a swapped asset fails the run instead of landing in
# /usr/local/bin. Regenerate with `make checksums` after bumping the version.
# Empty means unverified, which is what a "latest" pin necessarily gets.
delta_sha256:
  amd64: "50f08c879f84c81ceb220e476491a7f492d2c9c671e79918cc44badf961a6240"
  arm64: "da7f4338f593572ff426ae153e0870e2fdc72729416eff551b40cdeb67940db8"
