---
# role: delta
# Not from apt: noble ships 0.16.5, which predates the `navigate` keybindings
# and the hunk-header styling .gitconfig configures.

- name: "Resolve the delta version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: delta
    clis_repo: dandavison/delta
    clis_target: "{{ delta_version }}"

- name: "Decide whether delta must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: delta
    clis_bin: /usr/local/bin/delta
    clis_target: "{{ delta_version }}"

- name: "Install delta"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: delta
    clis_url: "{{ delta_url }}"
    clis_arch_map: "{{ delta_arch }}"
    clis_sha256: "{{ delta_sha256[clis_arch] }}"
    clis_files:
      - {src: "delta-{{ clis_version }}-{{ delta_arch[clis_arch] }}/delta", dest: "/usr/local/bin/delta"}
  when: clis_need_install | bool
