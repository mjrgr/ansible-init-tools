---
# Pinned so two machines provisioned months apart get the same binary.
# Set to "latest" to track upstream, or override on the command line:
#   -e certigo_version=<tag>
# Bump deliberately, then re-run the container tests.
certigo_version: "v1.18.0"

# v1.18.0 still reports 1.17.1: cli/cli.go hardcodes the constant, unbumped.
# Keyed by tag so a later bump falls back to the real number on its own.
certigo_reported_version:
  v1.18.0: "1.17.1"

# Upstream's own spelling of each target — no two projects agree on these.
certigo_arch:
  amd64: "amd64"
  arm64: "arm64"

certigo_url: "https://github.com/square/certigo/releases/download/{version}/certigo-linux-{arch}"

# Verified on download, so a swapped asset fails the run instead of landing in
# /usr/local/bin. Regenerate with `make checksums` after bumping the version.
# Empty means unverified, which is what a "latest" pin necessarily gets.
certigo_sha256:
  amd64: "0f3878fef6f42740d6a5dc201d3e7c6456299216ed0a3ec7254a65f5451068ae"
  arm64: "20439aeafa16d166c24f58eb8999c68f945a2deeb4e3590a6034541d25ff4477"
