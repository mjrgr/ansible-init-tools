---
# role: gh
# Upstream ships an already-dearmored keyring, so it drops straight into
# /etc/apt/keyrings with no gpg --dearmor step.

- name: "Fetch the GitHub CLI keyring"
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli.gpg
    mode: "0644"

- name: "Add the GitHub CLI apt source"
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/githubcli.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
    state: present

- name: "Install gh"
  ansible.builtin.apt:
    name: gh
    state: "{{ 'latest' if clis_state == 'latest' else 'present' }}"
    update_cache: true
