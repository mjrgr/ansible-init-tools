---
# role: gh
# Upstream ships an already-dearmored keyring, so it drops straight into
# /etc/apt/keyrings with no gpg --dearmor step.

- name: "Check for an already installed GitHub CLI keyring"
  ansible.builtin.stat:
    path: /etc/apt/keyrings/githubcli.gpg
  register: gh_keyring

- name: "Fetch the GitHub CLI keyring"
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli.gpg
    mode: "0644"
  register: gh_keyring_fetch
  retries: 3
  delay: 5
  until: gh_keyring_fetch is succeeded
  when: not gh_keyring.stat.exists

# apt_repository appends rather than replaces: if this repo was ever added by
# hand (GitHub's own docs use a different keyring filename), the old line
# stays and apt refuses the file over the Signed-By mismatch. Starting from a
# clean file makes this idempotent regardless of what pre-existed.
- name: "Remove any pre-existing GitHub CLI apt source"
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/github-cli.list
    state: absent

- name: "Add the GitHub CLI apt source"
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/githubcli.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
    state: present

- name: "Install gh"
  ansible.builtin.apt:
    name: gh
    state: "{{ 'latest' if clis_state == 'latest' else 'present' }}"
    update_cache: true
