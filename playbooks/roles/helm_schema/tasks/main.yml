---
# role: helm_schema

- name: "Resolve the helm-schema version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: helm_schema
    clis_repo: dadav/helm-schema
    clis_target: "{{ helm_schema_version }}"

- name: "Decide whether helm-schema must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: helm_schema
    clis_bin: /usr/local/bin/helm-schema
    clis_version_cmd: "/usr/local/bin/helm-schema --version"
    clis_target: "{{ helm_schema_version }}"

- name: "Install helm-schema"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: helm_schema
    clis_url: "{{ helm_schema_url }}"
    clis_arch_map: "{{ helm_schema_arch }}"
    clis_sha256: "{{ helm_schema_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/helm-schema --version"
    clis_files:
      - {src: "helm-schema", dest: "/usr/local/bin/helm-schema"}
  when: clis_need_install | bool
