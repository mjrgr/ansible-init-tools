---
# role: cmctl

- name: "Resolve the cmctl version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: cmctl
    clis_repo: cert-manager/cmctl
    clis_target: "{{ cmctl_version }}"

- name: "Decide whether cmctl must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: cmctl
    clis_bin: /usr/local/bin/cmctl
    clis_version_cmd: "/usr/local/bin/cmctl version --client --short"
    clis_target: "{{ cmctl_version }}"

- name: "Install cmctl"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: cmctl
    clis_url: "{{ cmctl_url }}"
    clis_arch_map: "{{ cmctl_arch }}"
    clis_sha256: "{{ cmctl_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/cmctl version --client --short"
    clis_dest: /usr/local/bin/cmctl
  when: clis_need_install | bool
