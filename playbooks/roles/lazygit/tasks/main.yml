---
# role: lazygit
# .zshrc has aliased `lg` to lazygit for a while with nothing installing it.
# Go, not Rust, but it lands in the same pass as the rest of the git tooling.

- name: "Resolve the lazygit version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: lazygit
    clis_repo: jesseduffield/lazygit
    clis_target: "{{ lazygit_version }}"

# `lazygit --version` prints one line of key=value pairs — commit hash, build
# date, version, arch, and a trailing `git version=`. The probe's default
# pattern would take the first thing shaped like a number, so the field is
# picked out explicitly. The `, ` anchor is what separates lazygit's own
# `version=` from git's, which is preceded by `git ` — without it the match
# would only be right by luck of the print order.
- name: "Decide whether lazygit must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: lazygit
    clis_bin: /usr/local/bin/lazygit
    clis_version_cmd: >-
      /usr/local/bin/lazygit --version | grep -oE ', version=[0-9]+\.[0-9]+\.[0-9]+'
    clis_target: "{{ lazygit_version }}"

- name: "Install lazygit"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: lazygit
    clis_url: "{{ lazygit_url }}"
    clis_arch_map: "{{ lazygit_arch }}"
    clis_sha256: "{{ lazygit_sha256[clis_arch] }}"
    clis_files:
      - {src: "lazygit", dest: "/usr/local/bin/lazygit"}
  when: clis_need_install | bool
