---
# role: cosign

- name: "Resolve the cosign version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: cosign
    clis_repo: sigstore/cosign
    clis_target: "{{ cosign_version }}"

# grep: `cosign version` opens with an ASCII banner; no -m1, an early exit SIGPIPEs cosign.
- name: "Decide whether cosign must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: cosign
    clis_bin: /usr/local/bin/cosign
    clis_version_cmd: "/usr/local/bin/cosign version 2>&1 | grep GitVersion"
    clis_target: "{{ cosign_version }}"

- name: "Install cosign"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_binary.yml"
  vars:
    clis_name: cosign
    clis_url: "{{ cosign_url }}"
    clis_arch_map: "{{ cosign_arch }}"
    clis_sha256: "{{ cosign_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/cosign version"
    clis_dest: /usr/local/bin/cosign
  when: clis_need_install | bool
