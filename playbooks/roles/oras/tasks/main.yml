---
# role: oras

- name: "Resolve the oras version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: oras
    clis_repo: oras-project/oras
    clis_target: "{{ oras_version }}"

- name: "Decide whether oras must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: oras
    clis_bin: /usr/local/bin/oras
    clis_version_cmd: "/usr/local/bin/oras version"
    clis_target: "{{ oras_version }}"

- name: "Install oras"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: oras
    clis_url: "{{ oras_url }}"
    clis_arch_map: "{{ oras_arch }}"
    clis_sha256: "{{ oras_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/oras version"
    clis_files:
      - {src: "oras", dest: "/usr/local/bin/oras"}
  when: clis_need_install | bool
