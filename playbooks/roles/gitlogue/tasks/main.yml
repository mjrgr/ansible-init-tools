---
# role: gitlogue

- name: "Resolve the gitlogue version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: gitlogue
    clis_repo: unhappychoice/gitlogue
    clis_target: "{{ gitlogue_version }}"

- name: "Decide whether gitlogue must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: gitlogue
    clis_bin: /usr/local/bin/gitlogue
    clis_target: "{{ gitlogue_version }}"

- name: "Install gitlogue"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: gitlogue
    clis_url: "{{ gitlogue_url }}"
    clis_arch_map: "{{ gitlogue_arch }}"
    clis_sha256: "{{ gitlogue_sha256[clis_arch] }}"
    clis_files:
      - {src: "gitlogue", dest: "/usr/local/bin/gitlogue"}
  when: clis_need_install | bool
