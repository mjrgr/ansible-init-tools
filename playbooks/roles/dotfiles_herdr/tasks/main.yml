---
# role: dotfiles_herdr — herdr config (the binary comes from the `herdr` role)

- name: "Create the herdr target directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dotfiles_home }}/.config/systemd/user"
    - "{{ dotfiles_home }}/.claude/skills/herdr"
    - "{{ dotfiles_home }}/.config/herdr-automatic-rename"

- name: "Deploy the herdr config and status publisher"
  ansible.builtin.include_tasks: "{{ role_path }}/../dotfiles_common/tasks/link.yml"
  loop:
    - { src: "{{ dotfiles_src }}/herdr/config.toml", dest: "{{ dotfiles_home }}/.config/herdr/config.toml" }
    - { src: "{{ dotfiles_src }}/herdr/herd-publish.sh", dest: "{{ dotfiles_home }}/.config/herdr/herd-publish.sh" }
    - { src: "{{ dotfiles_src }}/herdr/claude-statusline.sh", dest: "{{ dotfiles_home }}/.config/herdr/claude-statusline.sh" }
    - { src: "{{ dotfiles_src }}/herdr/quota-status.sh", dest: "{{ dotfiles_home }}/.config/herdr/quota-status.sh" }
    - { src: "{{ dotfiles_src }}/herdr/herd-publish.service", dest: "{{ dotfiles_home }}/.config/systemd/user/herd-publish.service" }
    - { src: "{{ dotfiles_src }}/herdr/automatic-rename.sh", dest: "{{ dotfiles_home }}/.config/herdr-automatic-rename/config.sh" }
  loop_control:
    loop_var: dl
    label: "{{ dl.dest }}"

# ---- Plugins ----
#
# Plugin builds run as children of `herdr plugin install`, and Ansible's PATH
# has no ~/.cargo/bin: cargo has to be reachable or every Rust plugin fails.
# The probes carry check_mode: false so a --check run still evaluates the rest.
- name: "Install the herdr plugins"
  environment:
    PATH: "{{ dotfiles_home }}/.cargo/bin:{{ dotfiles_home }}/.local/bin:{{ ansible_env.PATH }}"
  block:
    - name: "Look for cargo"
      ansible.builtin.command: cargo --version
      register: dotfiles_herdr_cargo
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "Read the installed clauth version"
      ansible.builtin.command: clauth --version
      register: dotfiles_herdr_clauth
      changed_when: false
      failed_when: false
      check_mode: false
      when: dotfiles_herdr_cargo.rc == 0

    # crates.io rather than a binary role: upstream ships no linux-arm64 asset,
    # and every binary role here has to checksum both targets.
    - name: "Install clauth from crates.io"
      ansible.builtin.command:
        argv: [cargo, install, clauth, --locked, --version, "{{ dotfiles_herdr_clauth_version }}"]
      when:
        - dotfiles_herdr_cargo.rc == 0
        - dotfiles_herdr_clauth_version not in (dotfiles_herdr_clauth.stdout | default(''))

    - name: "Look for the tools the plugins need"
      ansible.builtin.shell: |
        for tool in {{ (['herdr'] + (dotfiles_herdr_plugins | map(attribute='requires') | flatten)) | unique | join(' ') }}; do
          command -v "$tool" >/dev/null 2>&1 && echo "$tool"
        done
        exit 0
      args:
        executable: /bin/bash
      register: dotfiles_herdr_tools
      changed_when: false
      check_mode: false

    # `plugin install` always re-clones and replaces, so the guard is here:
    # install only when the source is absent or sits on another commit.
    - name: "List the installed herdr plugins"
      ansible.builtin.command: herdr plugin list --json
      register: dotfiles_herdr_plugin_list
      changed_when: false
      check_mode: false
      when: "'herdr' in dotfiles_herdr_tools.stdout_lines"

    - name: "Install the pinned herdr plugins"
      ansible.builtin.command:
        argv: [herdr, plugin, install, "{{ hp.source }}", --ref, "{{ hp.ref }}", --yes]
      loop: "{{ dotfiles_herdr_plugins }}"
      loop_control:
        loop_var: hp
        label: "{{ hp.source }} @ {{ hp.ref[:12] }}"
      vars:
        hp_installed: >-
          {{ (dotfiles_herdr_plugin_list.stdout | from_json).result.plugins
             | selectattr('source.kind', 'equalto', 'github')
             | selectattr('source.owner', 'equalto', hp.source.split('/')[0])
             | selectattr('source.repo', 'equalto', hp.source.split('/')[1])
             | map(attribute='source.resolved_commit') | first | default('') }}
      when:
        - "'herdr' in dotfiles_herdr_tools.stdout_lines"
        - hp.requires | difference(dotfiles_herdr_tools.stdout_lines) | length == 0
        - hp_installed != hp.ref

    - name: "Plugins skipped for want of a tool"
      ansible.builtin.debug:
        msg: >-
          {{ hp.source }}: needs {{ (['herdr'] + hp.requires) | difference(dotfiles_herdr_tools.stdout_lines) | join(', ') }}
      loop: "{{ dotfiles_herdr_plugins }}"
      loop_control:
        loop_var: hp
        label: "{{ hp.source }}"
      when: (['herdr'] + hp.requires) | difference(dotfiles_herdr_tools.stdout_lines) | length > 0

# The server caches config.toml at startup, so a fresh link would otherwise wait
# for the next herdr restart — hours away on a session that survives reboots.
# Never reported as changed: it reloads what is already on disk, and a task that
# claims a change on every run is a task that breaks the idempotence assertion.
# A non-zero rc just means no server is running, which is not an error here.
# agent-usage keeps these in its state dir, not config.toml; configure would
# also rewrite the rows and the statusLine, so the two files are set directly.
- name: "Set the herdr-agent-usage sidebar preferences"
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ dotfiles_home }}/.local/state/herdr/plugins/herdr-agent-usage/{{ item.key }}"
    mode: "0644"
  loop: "{{ dotfiles_herdr_agent_usage_prefs | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  when: (dotfiles_home ~ '/.local/state/herdr/plugins/herdr-agent-usage') is directory

- name: "Reload the running herdr server"
  ansible.builtin.command: herdr server reload-config
  changed_when: false
  failed_when: false

# ---- Agent skill ----
#
# `herdr --skill` prints the instructions for the herdr version that prints them,
# so this is generated rather than versioned: bumping herdr_version rewrites it,
# and a stale copy in the repo would teach Claude a CLI that no longer matches.
- name: "Render the herdr agent skill"
  ansible.builtin.command: herdr --skill
  register: dotfiles_herdr_skill
  changed_when: false
  failed_when: false

- name: "Install the herdr agent skill for Claude Code"
  ansible.builtin.copy:
    content: "{{ dotfiles_herdr_skill.stdout }}\n"
    dest: "{{ dotfiles_home }}/.claude/skills/herdr/SKILL.md"
    mode: "0644"
  when: dotfiles_herdr_skill.rc == 0

# ---- Claude Code wiring ----
#
# Neither of these two is optional in practice: without them the herdr sidebar
# never shows more than a pane's icon and title. Both are global
# (~/.claude/settings.json), so neither is a dotfile symlink — Claude Code
# itself writes there too, and a templated file would fight it on every run.
#
# The SessionStart hook is what tells herdr which pane holds which Claude
# session (`pane.report_agent_session`); without it herdr-agent-usage can never
# attribute a pane to a subscription and quietly clears its quota/context rows
# instead of guessing. `herdr integration install` owns that hooks entry and is
# idempotent in effect, but prints the same "installed / ensured" lines
# whether or not anything actually changed — same reasoning as reload-config
# above, so this stays changed_when: false rather than fail the idempotence
# assertion on every run.
- name: "Install herdr's Claude Code integration"
  ansible.builtin.command: herdr integration install claude
  changed_when: false
  when: "'herdr' in dotfiles_herdr_tools.stdout_lines"

# The statusLine is the other half: it is what feeds herdr-agent-usage its
# quota/context data in the first place. `herdr integration install` does not
# touch it — that plumbing is this plugin's own, not herdr core's — so it is
# chained here instead, idempotently and without disturbing whatever command
# was already configured (ccstatusline, a project's own status line, or none).
- name: "Chain herdr's statusLine wrapper into Claude Code settings"
  ansible.builtin.script:
    cmd: "wire-claude-statusline.py {{ dotfiles_home }}/.claude/settings.json {{ dotfiles_home }}/.config/herdr/claude-statusline.sh"
  register: dotfiles_herdr_statusline_wire
  changed_when: dotfiles_herdr_statusline_wire.stdout | trim == 'changed'
  when: "'herdr' in dotfiles_herdr_tools.stdout_lines"

# ---- Status publisher ----
#
# A user unit, not a line in .zshrc: the publisher must outlive the shell that
# started it and be restarted when it dies, and a shell-launched background loop
# gives neither.
#
# The gate is the manager's own control socket rather than `systemctl --user
# is-system-running`: that command answers "degraded" with rc 1 on a perfectly
# healthy WSL instance, so its exit status cannot be trusted and its output has
# to be pattern-matched. The socket exists exactly when the user manager is up,
# which is the question being asked. A container has neither, and skips.
- name: "Look for a user systemd instance"
  ansible.builtin.stat:
    path: "/run/user/{{ ansible_user_uid }}/systemd/private"
  register: dotfiles_herdr_systemd

# systemd, not systemd_service: the newer name only exists from ansible-core 2.17
# and 22.04 ships less than that. Module names resolve at load time, before any
# `when:` runs, so an unknown one fails the whole playbook on a host that would
# have skipped the task anyway. `systemd` stays an alias in current cores.
- name: "Enable the herd status publisher"
  ansible.builtin.systemd:
    name: herd-publish.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  when: dotfiles_herdr_systemd.stat.exists
