---
# role: nerdctl

- name: "Resolve the nerdctl version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: nerdctl
    clis_repo: containerd/nerdctl
    clis_target: "{{ nerdctl_version }}"

- name: "Decide whether nerdctl must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: nerdctl
    clis_bin: /usr/local/bin/nerdctl
    clis_target: "{{ nerdctl_version }}"

- name: "Install nerdctl"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: nerdctl
    clis_url: "{{ nerdctl_url }}"
    clis_arch_map: "{{ nerdctl_arch }}"
    clis_sha256: "{{ nerdctl_sha256[clis_arch] }}"
    clis_files:
      - {src: "nerdctl", dest: "/usr/local/bin/nerdctl"}
  when: clis_need_install | bool
