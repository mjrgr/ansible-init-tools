---
# role: nerdctl
- name: "Decide whether nerdctl must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: nerdctl
    clis_bin: /usr/local/bin/nerdctl
    clis_target: "{{ nerdctl_version }}"

- name: "Install nerdctl"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ nerdctl_version }}"
    # api.github.com allows 60 unauthenticated calls per hour per IP, which a
    # shared egress address burns through; the release redirect has no such limit.
    latest_tag() {
      curl -fsSLI --retry 3 --retry-all-errors --connect-timeout 15 -o /dev/null -w '%{url_effective}' "https://github.com/$1/releases/latest" \
        | sed 's#.*/tag/##'
    }
    [ "$VERSION" = latest ] && VERSION=$(latest_tag containerd/nerdctl)
    V="${VERSION#v}"
    curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 -o /tmp/nerdctl.tar.gz \
      "https://github.com/containerd/nerdctl/releases/download/v${V}/nerdctl-${V}-linux-amd64.tar.gz"
    tar xzf /tmp/nerdctl.tar.gz -C /tmp nerdctl
    install -m 0755 /tmp/nerdctl /usr/local/bin/nerdctl
    rm -f /tmp/nerdctl.tar.gz /tmp/nerdctl
    /usr/local/bin/nerdctl --version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
