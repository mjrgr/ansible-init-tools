---
# role: k9s

- name: "Resolve the k9s version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: k9s
    clis_repo: derailed/k9s
    clis_target: "{{ k9s_version }}"

- name: "Decide whether k9s must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: k9s
    clis_bin: /usr/local/bin/k9s
    clis_version_cmd: "/usr/local/bin/k9s version -s"
    clis_target: "{{ k9s_version }}"

- name: "Install k9s"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: k9s
    clis_url: "{{ k9s_url }}"
    clis_arch_map: "{{ k9s_arch }}"
    clis_sha256: "{{ k9s_sha256[clis_arch] }}"
    clis_verify_cmd: "/usr/local/bin/k9s version -s"
    clis_files:
      - {src: "k9s", dest: "/usr/local/bin/k9s"}
  when: clis_need_install | bool
