---
# role: crictl
- name: "Decide whether crictl must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: crictl
    clis_bin: /usr/local/bin/crictl
    clis_target: "{{ crictl_version }}"

- name: "Install crictl"
  ansible.builtin.shell: |
    set -euo pipefail
    VERSION="{{ crictl_version }}"
    # api.github.com allows 60 unauthenticated calls per hour per IP, which a
    # shared egress address burns through; the release redirect has no such limit.
    latest_tag() {
      curl -fsSLI --retry 3 --retry-all-errors --connect-timeout 15 -o /dev/null -w '%{url_effective}' "https://github.com/$1/releases/latest" \
        | sed 's#.*/tag/##'
    }
    [ "$VERSION" = latest ] && VERSION=$(latest_tag kubernetes-sigs/cri-tools)
    curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 -o /tmp/crictl.tgz \
      "https://github.com/kubernetes-sigs/cri-tools/releases/download/${VERSION}/crictl-${VERSION}-linux-amd64.tar.gz"
    tar xzf /tmp/crictl.tgz -C /usr/local/bin crictl
    chmod +x /usr/local/bin/crictl
    rm -f /tmp/crictl.tgz
    /usr/local/bin/crictl --version
  args:
    executable: /bin/bash
  when: clis_need_install | bool
