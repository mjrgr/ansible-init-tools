---
# role: crictl

- name: "Resolve the crictl version and architecture"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/resolve.yml"
  vars:
    clis_name: crictl
    clis_repo: kubernetes-sigs/cri-tools
    clis_target: "{{ crictl_version }}"

- name: "Decide whether crictl must be installed"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/probe.yml"
  vars:
    clis_name: crictl
    clis_bin: /usr/local/bin/crictl
    clis_target: "{{ crictl_version }}"

- name: "Install crictl"
  ansible.builtin.include_tasks: "{{ role_path }}/../clis_common/tasks/install_archive.yml"
  vars:
    clis_name: crictl
    clis_url: "{{ crictl_url }}"
    clis_arch_map: "{{ crictl_arch }}"
    clis_sha256: "{{ crictl_sha256[clis_arch] }}"
    clis_files:
      - {src: "crictl", dest: "/usr/local/bin/crictl"}
  when: clis_need_install | bool
